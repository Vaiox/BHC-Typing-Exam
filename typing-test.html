<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHC Typing Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#f0f0f0;font-family:Arial,sans-serif;min-height:100vh}
.container{max-width:1500px;margin:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#121212;border:1px solid #1f1f1f;padding:12px 16px;border-radius:12px;margin-bottom:10px;position:sticky;top:0;z-index:10}
.top-left{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.timer{font-size:24px;font-weight:700;color:#00ffae}
.info{color:#888;font-size:14px}
.typing-area{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:15px}
.preview,textarea{width:100%;height:800px;min-width:0;background:#101010;border:1px solid #1b1b1b;border-radius:14px;padding:20px 22px;color:#ddd;font:16px/1.55 Arial,sans-serif;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;scrollbar-width:thin;scrollbar-color:#555 #101010}
.preview{color:#aaa}
.preview::-webkit-scrollbar,textarea::-webkit-scrollbar{width:8px}
.preview::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:#555;border-radius:10px}
textarea{background:#0f0f0f;color:#f1f1f1;resize:none;outline:none;caret-color:#00ffae}
textarea:focus{border-color:#00ffae;box-shadow:0 0 0 3px #00ffae14}
textarea:disabled{opacity:.75}
.typing-box-hidden{opacity:0!important}
.buttons{margin:18px 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:sticky;top:70px;z-index:9}
button{border:0;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#00ffae,#00cfff);color:#000;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.access-notice{display:none;margin:14px 0;padding:14px 16px;border:1px solid #593333;border-radius:10px;background:#241818;color:#ffb0b0;line-height:1.6;font-size:14px;overflow-wrap:anywhere}
.access-notice.visible{display:block}
.result{display:none;margin-top:25px;background:#111;border:1px solid #1c1c1c;border-radius:16px;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:24px}
.card{background:#171717;border:1px solid #232323;border-radius:14px;padding:18px;text-align:center}
.card h3{font-size:14px;color:#888;margin-bottom:10px;font-weight:500}
.card p{font-size:28px;font-weight:700;color:#00ffae}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{background:#181818;border:1px solid #252525;border-radius:14px;padding:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:break-word;min-width:0}
.red{color:#ff5252}
.missing{background:#ff9800;color:#000;padding:2px 4px;border-radius:4px}
.extra{background:#ffe600;color:#000;padding:2px 4px;border-radius:4px}
.dim{opacity:.35}
.wordCount{margin-top:12px;text-align:center;color:#00ffa6;font-size:18px;font-weight:600}
@media(max-width:900px){
  .typing-area,.compare{grid-template-columns:1fr}
  .preview{height:auto;min-height:300px}
  .typing-area textarea{height:420px}
  .topbar{align-items:flex-start;flex-direction:column}
  .container{padding:12px}
  .result{padding:14px}
}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="top-left">
      <div class="timer" id="timer">10:00</div>
      <div class="info">Strict Mode Enabled</div>
      <div class="info" id="wordCount">0 / 0 words</div>
      <div class="info" id="keystrokeCount">Keystrokes 0 / 0</div>
    </div>
    <div class="info" id="passageInfo">Loading passage...</div>
  </div>

  <div id="accessNotice" class="access-notice" role="alert" aria-live="assertive"></div>

  <div class="typing-area">
    <div class="preview" id="preview">Checking your account...</div>
    <textarea id="input" spellcheck="false" autocomplete="off"
      autocorrect="off" autocapitalize="off"
      placeholder="Start typing here..." disabled></textarea>
  </div>

  <div class="buttons">
    <button id="startButton" disabled>Start Test</button>
    <button id="restartButton" disabled>Restart Same Passage</button>
    <button id="submitButton" disabled>Submit</button>
    <button id="toggleTypingBtn" disabled>Hide Typing Box</button>
  </div>

  <div class="result" id="result">
    <div class="stats">
      <div class="card"><h3>Gross WPM</h3><p id="gross">0</p></div>
      <div class="card"><h3>Net WPM</h3><p id="net">0</p></div>
      <div class="card"><h3>Accuracy</h3><p id="accuracy">0%</p></div>
      <div class="card"><h3>Errors (400 Words)</h3><p id="errors400">0</p></div>
      <div class="card"><h3>Total Errors</h3><p id="errors">0</p></div>
      <div class="card"><h3>Score</h3><p id="score">0</p></div>
    </div>

    <div class="compare">
      <div class="box">
        <h3>Original Passage</h3><br>
        <div id="originalBox"></div>
      </div>
      <div class="box">
        <h3>Your Typing</h3><br>
        <div id="typedBox"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";

const DAILY_LIMIT = 10;
const DAILY_LIMIT_MESSAGE =
  "Daily test limit reached. Please come back tomorrow.";

const passageFiles = {
  2400: "./2400-passage.js",
  2600: "./2600-passage.js",
  2800: "./2800-passage.js",
  3000: "./3000-passage.js"
};

let passages = {};

let currentPassageLimit =
  Number(localStorage.getItem("selectedKeystrokeLimit"));

if (!Object.prototype.hasOwnProperty.call(
  passageFiles,
  currentPassageLimit
)) {
  currentPassageLimit = 2400;
}

const input = document.getElementById("input");
const timer = document.getElementById("timer");
const preview = document.getElementById("preview");
const accessNotice = document.getElementById("accessNotice");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");
const submitButton = document.getElementById("submitButton");
const toggleTypingBtn = document.getElementById("toggleTypingBtn");

let currentPassage = "";
let currentId = 0;
let timerStarted = false;
let testSubmitted = false;
let submissionInProgress = false;
let accessGranted = false;
let timeLeft = 600;
let interval = null;
let totalWords = 0;
let currentUser = null;

/* =========================================================
   LOAD SELECTED PASSAGE COLLECTION
========================================================= */

async function loadPassages(limit) {
  const file = passageFiles[limit];

  if (!file) {
    throw new Error("Invalid passage length selected.");
  }

  const passageModule = await import(file);

  if (
    !passageModule.passages ||
    typeof passageModule.passages !== "object" ||
    !Object.keys(passageModule.passages).length
  ) {
    throw new Error(`No passages found in ${file}`);
  }

  passages = passageModule.passages;
  currentPassageLimit = limit;
}

/* =========================================================
   NOTICES AND HELPERS
========================================================= */

function showNotice(message) {
  accessNotice.textContent = message;
  accessNotice.classList.add("visible");
}

function clearNotice() {
  accessNotice.textContent = "";
  accessNotice.classList.remove("visible");
}

function countKeystrokes(text) {
  return [...text].length;
}

function getWordTokens(text) {
  return text
    .replace(/\r/g, "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);
}

function updateCounters() {
  document.getElementById("wordCount").textContent =
    `${getWordTokens(input.value).length} / ${totalWords} words`;

  document.getElementById("keystrokeCount").textContent =
    `Keystrokes ${countKeystrokes(input.value)} / ${countKeystrokes(currentPassage)}`;
}

function setTypingControlsEnabled(enabled) {
  input.disabled = !enabled;
  startButton.disabled = !enabled;
  restartButton.disabled = !enabled;
  toggleTypingBtn.disabled = !enabled;
  submitButton.disabled = !enabled || submissionInProgress;
}

function stopTimer() {
  if (interval !== null) {
    clearInterval(interval);
    interval = null;
  }
}

/* =========================================================
   INDIA DAY BOUNDS
========================================================= */

function getIndiaDayBounds() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const part = type =>
    parts.find(item => item.type === type).value;

  const day =
    `${part("year")}-${part("month")}-${part("day")}`;

  const start = new Date(`${day}T00:00:00+05:30`);
  const end = new Date(start.getTime() + 86400000);

  return {
    start: start.toISOString(),
    end: end.toISOString()
  };
}

/* =========================================================
   AUTHENTICATION AND SUBSCRIPTION
========================================================= */

async function signOutAndRedirect(reason) {
  accessGranted = false;
  setTypingControlsEnabled(false);
  stopTimer();

  try {
    await supabase.auth.signOut();
  } catch (error) {
    console.error("Sign-out failed:", error);
  }

  window.location.replace(
    reason === "expired"
      ? "./index.html?status=subscription_expired"
      : "./index.html"
  );
}

async function initializeAccess() {
  try {
    const {
      data: sessionData,
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      window.location.replace("./index.html");
      return;
    }

    currentUser = sessionData.session.user;

    const {
      data,
      error
    } = await supabase.rpc("ensure_my_subscription");

    if (error) throw error;

    const sub = Array.isArray(data) ? data[0] : data;

    if (!sub) {
      throw new Error("Subscription information is unavailable.");
    }

    const expiry = new Date(sub.subscription_expires_at);

    if (
      sub.is_expired ||
      !Number.isFinite(expiry.getTime()) ||
      expiry.getTime() <= Date.now()
    ) {
      await signOutAndRedirect("expired");
      return;
    }

    const bounds = getIndiaDayBounds();

    const {
      count,
      error: countError
    } = await supabase
      .from("test_results")
      .select("id", { count: "exact", head: true })
      .eq("user_id", currentUser.id)
      .gte("created_at", bounds.start)
      .lt("created_at", bounds.end);

    if (countError) throw countError;

    if ((count || 0) >= DAILY_LIMIT) {
      preview.textContent = DAILY_LIMIT_MESSAGE;
      showNotice(DAILY_LIMIT_MESSAGE);
      setTypingControlsEnabled(false);
      return;
    }

    try {
      await loadPassages(currentPassageLimit);
    } catch (error) {
      console.error("Passage loading failed:", error);

      preview.textContent =
        "Unable to load the selected passages.";

      showNotice(
        `Could not load the ${currentPassageLimit}-keystroke passage file. Check that the file exists and refresh.`
      );

      setTypingControlsEnabled(false);
      return;
    }

    accessGranted = true;
    setTypingControlsEnabled(true);
    prepareTest();

  } catch (error) {
    console.error("Access verification failed:", error);

    setTypingControlsEnabled(false);
    preview.textContent = "Unable to verify your account.";

    showNotice(
      "Unable to verify your subscription. Check your connection and refresh the page."
    );
  }
}

/* =========================================================
   PREPARE TEST
========================================================= */

function prepareTest() {
  if (!accessGranted || !currentUser || submissionInProgress) {
    return;
  }

  stopTimer();

  timer.textContent = "10:00";
  timeLeft = 600;
  timerStarted = false;
  testSubmitted = false;

  clearNotice();

  const historyKey = `recentPassages_${currentPassageLimit}`;

  let history = [];

  try {
    history = JSON.parse(
      localStorage.getItem(historyKey) || "[]"
    );

    if (!Array.isArray(history)) history = [];
  } catch {
    history = [];
  }

  const allIds = Object.keys(passages);

  const unusedIds = allIds.filter(
    id => !history.includes(id)
  );

  const usableIds = unusedIds.length ? unusedIds : allIds;

  if (!usableIds.length) {
    showNotice("No passages are available in this collection.");
    return;
  }

  currentId =
    usableIds[Math.floor(Math.random() * usableIds.length)];

  currentPassage = passages[currentId];

  history.push(currentId);

  if (history.length > 25) {
    history.shift();
  }

  localStorage.setItem(historyKey, JSON.stringify(history));

  preview.textContent = currentPassage;

  document.getElementById("passageInfo").textContent =
    `Passage #${currentId} · ${currentPassageLimit} keystrokes`;

  document.getElementById("result").style.display = "none";

  totalWords = getWordTokens(currentPassage).length;

  input.value = "";
  input.disabled = false;
  startButton.disabled = false;
  restartButton.disabled = false;
  submitButton.disabled = false;
  toggleTypingBtn.disabled = false;

  input.classList.remove("typing-box-hidden");
  toggleTypingBtn.textContent = "Hide Typing Box";

  updateCounters();
  input.focus();
}

function restartSame() {
  if (!accessGranted || submissionInProgress || testSubmitted) {
    return;
  }

  stopTimer();

  timer.textContent = "10:00";
  timeLeft = 600;
  timerStarted = false;

  input.disabled = false;
  submitButton.disabled = false;
  input.value = "";

  clearNotice();
  updateCounters();
  input.focus();
}

/* =========================================================
   TIMER
========================================================= */

function startTimer() {
  if (
    interval !== null ||
    testSubmitted ||
    submissionInProgress
  ) {
    return;
  }

  interval = setInterval(() => {
    timeLeft = Math.max(0, timeLeft - 1);

    timer.textContent =
      String(Math.floor(timeLeft / 60)).padStart(2, "0") +
      ":" +
      String(timeLeft % 60).padStart(2, "0");

    if (timeLeft <= 0) {
      stopTimer();
      input.disabled = true;
      submitTest();
    }
  }, 1000);
}

/* =========================================================
   STRICT TYPING RULES
========================================================= */

input.addEventListener("keydown", event => {
  if (
    !accessGranted ||
    testSubmitted ||
    submissionInProgress
  ) {
    event.preventDefault();
    return;
  }

  if (
    [
      "Backspace",
      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown"
    ].includes(event.key)
  ) {
    event.preventDefault();
  }

  if (event.ctrlKey || event.metaKey) {
    event.preventDefault();
  }

  if (event.key === "Tab") {
    event.preventDefault();

    const start = input.selectionStart;
    const end = input.selectionEnd;

    input.value =
      input.value.substring(0, start) +
      "\t" +
      input.value.substring(end);

    input.selectionStart = input.selectionEnd = start + 1;

    input.dispatchEvent(
      new Event("input", { bubbles: true })
    );
  }
});

input.addEventListener("paste", event => {
  event.preventDefault();
});

input.addEventListener("input", () => {
  if (
    !accessGranted ||
    testSubmitted ||
    submissionInProgress
  ) {
    return;
  }

  if (!timerStarted && input.value.length > 0) {
    timerStarted = true;
    startTimer();
  }

  updateCounters();
});

/* =========================================================
   VISUAL COMPARISON HELPERS
========================================================= */

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* Used only for visual comparison, not numerical errors. */
function tokenize(text) {
  text = text
    .replace(/\r/g, "")
    .replace(/[ ]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

  return text.match(
    /\t|\n+|[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*|[.,!?;:%()[\]]/g
  ) || [];
}

/* =========================================================
   BHC WORD-LEVEL ERROR COUNTING
   One wrong, missing, or extra whitespace-separated word
   counts as one error.
========================================================= */

function countBhcWordErrors(original, typed) {
  const originalWords = getWordTokens(original);
  const typedWords = getWordTokens(typed);

  const m = originalWords.length;
  const n = typedWords.length;

  const dp = Array.from(
    { length: m + 1 },
    () => Array(n + 1).fill(0)
  );

  const operation = Array.from(
    { length: m + 1 },
    () => Array(n + 1).fill(null)
  );

  for (let i = 1; i <= m; i++) {
    dp[i][0] = i;
    operation[i][0] = "delete";
  }

  for (let j = 1; j <= n; j++) {
    dp[0][j] = j;
    operation[0][j] = "insert";
  }

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (originalWords[i - 1] === typedWords[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
        operation[i][j] = "match";
      } else {
        const replaceCost = dp[i - 1][j - 1] + 1;
        const deleteCost = dp[i - 1][j] + 1;
        const insertCost = dp[i][j - 1] + 1;

        const best = Math.min(
          replaceCost,
          deleteCost,
          insertCost
        );

        dp[i][j] = best;

        /* Prefer replacement on equal costs. */
        if (best === replaceCost) {
          operation[i][j] = "replace";
        } else if (best === deleteCost) {
          operation[i][j] = "delete";
        } else {
          operation[i][j] = "insert";
        }
      }
    }
  }

  let i = m;
  let j = n;

  let errors = 0;
  let errors400 = 0;

  while (i > 0 || j > 0) {
    const op = operation[i][j];

    if (op === "match") {
      i--;
      j--;
      continue;
    }

    if (op === "replace") {
      errors++;

      if (i <= 400) {
        errors400++;
      }

      i--;
      j--;
      continue;
    }

    if (op === "delete") {
      errors++;

      if (i <= 400) {
        errors400++;
      }

      i--;
      continue;
    }

    if (op === "insert") {
      errors++;

      if (i < 400) {
        errors400++;
      }

      j--;
      continue;
    }

    /* Defensive fallback. */
    if (i > 0 && j > 0) {
      errors++;

      if (i <= 400) {
        errors400++;
      }

      i--;
      j--;
    } else if (i > 0) {
      errors++;

      if (i <= 400) {
        errors400++;
      }

      i--;
    } else if (j > 0) {
      errors++;

      if (i < 400) {
        errors400++;
      }

      j--;
    }
  }

  return { errors, errors400 };
}

/* =========================================================
   VISUAL TOKEN ALIGNMENT
   Used only to color the original/typed comparison.
========================================================= */

function alignAndCount(original, typed) {
  const a = tokenize(original);
  const b = tokenize(typed);

  const m = a.length;
  const n = b.length;

  const dp = Array.from(
    { length: m + 1 },
    () => Array(n + 1).fill(0)
  );

  for (let i = 0; i <= m; i++) {
    dp[i][0] = i;
  }

  for (let j = 0; j <= n; j++) {
    dp[0][j] = j;
  }

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i - 1] === b[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = Math.min(
          dp[i - 1][j],
          dp[i][j - 1],
          dp[i - 1][j - 1]
        ) + 1;
      }
    }
  }

  let i = m;
  let j = n;

  const alignedA = [];
  const alignedB = [];

  while (i > 0 || j > 0) {
    if (
      i > 0 &&
      j > 0 &&
      a[i - 1] === b[j - 1]
    ) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift(b[j - 1]);
      i--;
      j--;
    } else if (
      i > 0 &&
      j > 0 &&
      dp[i][j] === dp[i - 1][j - 1] + 1
    ) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift(b[j - 1]);
      i--;
      j--;
    } else if (
      i > 0 &&
      dp[i][j] === dp[i - 1][j] + 1
    ) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift("∅");
      i--;
    } else {
      alignedA.unshift("∅");
      alignedB.unshift(b[j - 1]);
      j--;
    }
  }

  return { alignedA, alignedB };
}

function formatToken(token) {
  if (token === "\n" || token === "\n\n") {
    return "<br><br>";
  }

  if (token === "\t") {
    return "&nbsp;&nbsp;&nbsp;&nbsp;";
  }

  return escapeHTML(token) + " ";
}

/* =========================================================
   WORD-LEVEL ACCURACY
========================================================= */

function countCorrectWords(originalWords, typedWords) {
  const m = originalWords.length;
  const n = typedWords.length;

  const dp = Array.from(
    { length: m + 1 },
    () => Array(n + 1).fill(0)
  );

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (originalWords[i - 1] === typedWords[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(
          dp[i - 1][j],
          dp[i][j - 1]
        );
      }
    }
  }

  return dp[m][n];
}

/* =========================================================
   CALCULATE RESULT
========================================================= */

function calculateResult() {
  const typed = input.value;

  const { alignedA, alignedB } =
    alignAndCount(currentPassage, typed);

  let originalHTML = "";
  let typedHTML = "";

  for (let i = 0; i < alignedA.length; i++) {
    const o = alignedA[i];
    const t = alignedB[i];

    if (o === t) {
      originalHTML += formatToken(o);
      typedHTML += formatToken(t);
    } else {
      if (
        (o === "\n" || o === "\n\n") &&
        t === "∅"
      ) {
        continue;
      }

      if (o === "∅") {
        originalHTML += '<span class="dim">∅</span> ';
        typedHTML +=
          `<span class="extra">${escapeHTML(t)}</span> `;
      } else if (t === "∅") {
        originalHTML +=
          `<span class="missing">${escapeHTML(o)}</span> `;
        typedHTML += '<span class="dim">∅</span> ';
      } else {
        originalHTML +=
          `<span class="red">${escapeHTML(o)}</span> `;
        typedHTML +=
          `<span class="red">${escapeHTML(t)}</span> `;
      }
    }
  }

  /* Numerical BHC errors come from word-level alignment. */
  const { errors, errors400 } =
    countBhcWordErrors(currentPassage, typed);

  const originalWords = getWordTokens(currentPassage);
  const typedWords = getWordTokens(typed);

  const correctWordCount =
    countCorrectWords(originalWords, typedWords);

  const accuracy = originalWords.length > 0
    ? (
        (correctWordCount / originalWords.length) * 100
      ).toFixed(2)
    : "0.00";

  const elapsedSeconds = Math.max(1, 600 - timeLeft);
  const minutes = elapsedSeconds / 60;

  const gross = (
    (typed.length / 5) / minutes
  ).toFixed(2);

  const net = (
    Number(gross) * (Number(accuracy) / 100)
  ).toFixed(2);

  const score400 = Math.max(
    0,
    20 - errors400 * 0.25
  ).toFixed(2);

  const score = Math.max(
    0,
    20 - errors * 0.25
  ).toFixed(2);

  originalHTML = originalHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  typedHTML = typedHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  return {
    gross: Number(gross),
    net: Number(net),
    accuracy: Number(accuracy),
    errors400,
    errors,
    score400: Number(score400),
    score: Number(score),
    durationSeconds: elapsedSeconds,
    wordsTyped: typedWords.length,
    keystrokes: countKeystrokes(typed),
    originalHTML,
    typedHTML,
    givenPassage: currentPassage,
    typedPassage: typed
  };
}

/* =========================================================
   SECURE RESULT SUBMISSION
========================================================= */

async function submitTest() {
  if (
    !accessGranted ||
    !currentUser ||
    testSubmitted ||
    submissionInProgress
  ) {
    return;
  }

  if (!currentPassage) {
    showNotice("Please start a test first.");
    return;
  }

  submissionInProgress = true;

  stopTimer();

  input.disabled = true;
  startButton.disabled = true;
  restartButton.disabled = true;
  submitButton.disabled = true;
  toggleTypingBtn.disabled = true;

  clearNotice();
  showNotice("Submitting your result securely...");

  try {
    const {
      data: sessionData,
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      await signOutAndRedirect("login");
      return;
    }

    const {
      data: subData,
      error: subError
    } = await supabase.rpc("ensure_my_subscription");

    if (subError) throw subError;

    const sub = Array.isArray(subData) ? subData[0] : subData;

    const expiry = sub
      ? new Date(sub.subscription_expires_at)
      : new Date(NaN);

    if (
      !sub ||
      sub.is_expired ||
      !Number.isFinite(expiry.getTime()) ||
      expiry.getTime() <= Date.now()
    ) {
      await signOutAndRedirect("expired");
      return;
    }

    const result = calculateResult();

    const {
      data,
      error
    } = await supabase.rpc("submit_typing_result", {
      p_passage_label: `Passage #${currentId}`,
      p_gross_wpm: result.gross,
      p_net_wpm: result.net,
      p_accuracy: result.accuracy,
      p_errors_400: result.errors400,
      p_errors_total: result.errors,
      p_score_400: result.score400,
      p_score_total: result.score,
      p_duration_seconds: result.durationSeconds,
      p_words_typed: result.wordsTyped,
      p_keystrokes: result.keystrokes
    });

    if (error) {
      const message =
        String(error.message || "").toUpperCase();

      if (message.includes("SUBSCRIPTION_EXPIRED")) {
        await signOutAndRedirect("expired");
        return;
      }

      if (message.includes("DAILY_LIMIT_REACHED")) {
        accessGranted = false;
        setTypingControlsEnabled(false);
        showNotice(DAILY_LIMIT_MESSAGE);
        return;
      }

      if (
        message.includes("AUTHENTICATION_REQUIRED") ||
        message.includes("JWT") ||
        message.includes("NOT AUTHENTICATED")
      ) {
        await signOutAndRedirect("login");
        return;
      }

      if (message.includes("SUBSCRIPTION_NOT_INITIALIZED")) {
        showNotice(
          "Your subscription could not be initialized. Please return to the dashboard and try again."
        );
        return;
      }

      console.error("Result submission failed:", error);

      showNotice(
        "Your result could not be saved. It has not been accepted. Check your connection and try submitting again."
      );

      return;
    }

    if (data?.accepted !== true || !data.result_id) {
      showNotice(
        "The database did not confirm acceptance. Your result has not been redirected."
      );
      return;
    }

    const comparison = {
      resultId: data.result_id,
      givenPassage: result.givenPassage,
      typedPassage: result.typedPassage,
      originalHTML: result.originalHTML,
      typedHTML: result.typedHTML,
      savedAt: new Date().toISOString()
    };

    try {
      localStorage.setItem(
        "latestTypingComparison",
        JSON.stringify(comparison)
      );
    } catch (storageError) {
      console.error("Could not save comparison:", storageError);
      localStorage.removeItem("latestTypingComparison");
    }

    testSubmitted = true;

    window.location.replace(
      `./result.html?id=${encodeURIComponent(data.result_id)}`
    );

  } catch (error) {
    console.error("Submission error:", error);

    showNotice(
      "An unexpected error occurred. Your result has not been confirmed as saved."
    );

  } finally {
    submissionInProgress = false;

    if (!testSubmitted && accessGranted) {
      input.disabled = true;
      submitButton.disabled = false;
      toggleTypingBtn.disabled = false;
    }
  }
}

/* =========================================================
   HIDE / SHOW TYPING BOX
========================================================= */

function toggleTypingBox() {
  const hidden =
    input.classList.toggle("typing-box-hidden");

  toggleTypingBtn.textContent =
    hidden ? "Show Typing Box" : "Hide Typing Box";

  input.focus();
}

/* =========================================================
   EVENTS AND INITIALIZATION
========================================================= */

window.addEventListener("contextmenu", event => {
  event.preventDefault();
});

startButton.addEventListener("click", prepareTest);
restartButton.addEventListener("click", restartSame);
submitButton.addEventListener("click", submitTest);
toggleTypingBtn.addEventListener("click", toggleTypingBox);

supabase.auth.onAuthStateChange(event => {
  if (event === "SIGNED_OUT" && accessGranted) {
    accessGranted = false;
    window.location.replace("./index.html");
  }
});

setTypingControlsEnabled(false);
initializeAccess();
</script>
