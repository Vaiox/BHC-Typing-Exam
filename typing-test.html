
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHC Typing Test</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#f0f0f0;font-family:Arial,sans-serif;min-height:100vh}
.container{width:100%;max-width:1500px;margin:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#121212;border:1px solid #1f1f1f;padding:16px 20px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.4);position:sticky;top:0;z-index:100}
.top-left{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.timer{font-size:24px;font-weight:700;color:#00ffae}
.info{color:#888;font-size:14px}
.buttons{margin-top:18px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:sticky;top:70px;z-index:99}
button{border:none;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#00ffae,#00cfff);color:#000;font-weight:700;font-size:15px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,255,174,.2)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}

:root{
  --paper-bg:#fff;--paper-text:#202020;--paper-font:Arial,sans-serif;
  --paper-font-size:16px;--paper-line-height:1.65;
  --paper-padding-x:64px;--paper-padding-y:54px
}
.typing-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;margin-bottom:16px}
.paper-column{min-width:0}
.paper-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 9px;padding:0 2px;color:#e8e8e8;font-size:14px;font-weight:700}
.paper-heading span{color:#00ffae;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.paper-workspace{position:relative;display:grid;grid-template-columns:27px minmax(0,1fr);grid-template-rows:25px minmax(0,1fr);height:800px;min-height:400px;overflow:hidden;background:#dfe1e5;border:1px solid #b9bdc4;border-radius:3px;box-shadow:0 7px 24px rgba(0,0,0,.28)}
.ruler-corner{grid-column:1;grid-row:1;background:#e7e8eb;border-right:1px solid #c6c9cf;border-bottom:1px solid #c6c9cf}
.horizontal-ruler{grid-column:2;grid-row:1;position:relative;overflow:hidden;background-color:#f1f2f4;border-bottom:1px solid #c6c9cf;background-image:repeating-linear-gradient(to right,transparent 0,transparent 23px,#a3a8af 23px,#a3a8af 24px,transparent 24px,transparent 95px,#858b93 95px,#858b93 96px)}
.horizontal-ruler::before{content:"0          1          2          3          4          5          6          7          8";position:absolute;inset:1px 0 auto 5px;white-space:pre;color:#555b63;font:9px/11px Arial,sans-serif;letter-spacing:5px;pointer-events:none}
.vertical-ruler{grid-column:1;grid-row:2;position:relative;overflow:hidden;background-color:#f1f2f4;border-right:1px solid #c6c9cf;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#a3a8af 23px,#a3a8af 24px,transparent 24px,transparent 95px,#858b93 95px,#858b93 96px)}
.vertical-ruler::before{content:"1\A\A\A\A2\A\A\A\A3\A\A\A\A4\A\A\A\A5\A\A\A\A6\A\A\A\A7\A\A\A\A8";position:absolute;top:3px;left:5px;white-space:pre;color:#555b63;font:9px/24px Arial,sans-serif;pointer-events:none}
.typing-area .preview,.typing-area textarea{grid-column:2;grid-row:2;display:block;width:100%;min-width:0;height:100%;min-height:0;margin:0;border:0;border-radius:0;padding:var(--paper-padding-y) var(--paper-padding-x);background:var(--paper-bg);color:var(--paper-text);font-family:var(--paper-font);font-size:var(--paper-font-size);font-weight:400;line-height:var(--paper-line-height);letter-spacing:normal;text-align:left;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;-moz-tab-size:4;box-shadow:none;scrollbar-width:thin;scrollbar-color:#aeb3ba #f3f3f3}
.typing-area .preview{overflow:auto;color:var(--paper-text);overflow-x:hidden}
.typing-area textarea{resize:none;outline:none;overflow:auto;caret-color:#1677d2;transition:box-shadow .15s ease}
.typing-area textarea:focus{box-shadow:inset 0 0 0 2px rgba(22,119,210,.22)}
.typing-area textarea::placeholder{color:#777;opacity:1}
.typing-area .preview::-webkit-scrollbar,.typing-area textarea::-webkit-scrollbar{width:10px}
.typing-area .preview::-webkit-scrollbar-track,.typing-area textarea::-webkit-scrollbar-track{background:#f3f3f3}
.typing-area .preview::-webkit-scrollbar-thumb,.typing-area textarea::-webkit-scrollbar-thumb{background:#b8bdc4;border:2px solid #f3f3f3;border-radius:8px}
.typing-area .preview::-webkit-scrollbar-thumb:hover,.typing-area textarea::-webkit-scrollbar-thumb:hover{background:#9299a2}
.typing-area textarea.typing-box-hidden{opacity:0!important}
.wordCount{margin-top:12px;text-align:center;color:#00ffa6;font-size:18px;font-weight:600}
.access-notice{display:none;margin:14px 0;padding:14px 16px;border:1px solid #593333;border-radius:10px;background:#241818;color:#ffb0b0;line-height:1.6;font-size:14px;overflow-wrap:anywhere}
.access-notice.visible{display:block}
@media(max-width:900px){
  .typing-area{grid-template-columns:minmax(0,1fr);gap:20px}
  .paper-workspace{height:620px}
  :root{--paper-padding-x:34px;--paper-padding-y:36px;--paper-font-size:15px;--paper-line-height:1.6}
  .topbar{flex-direction:column;align-items:flex-start;gap:12px}
}
@media(max-width:480px){
  .container{padding:12px}
  .paper-workspace{grid-template-columns:21px minmax(0,1fr);grid-template-rows:22px minmax(0,1fr);height:540px}
  .horizontal-ruler::before{letter-spacing:2px}
  :root{--paper-padding-x:22px;--paper-padding-y:28px;--paper-font-size:14px;--paper-line-height:1.6}
  .paper-heading{font-size:13px}
}
</style>
</head>

<body>
<div class="container">
  <div class="topbar">
    <div class="top-left">
      <div class="timer" id="timer">10:00</div>
      <div class="info">Strict Mode Enabled</div>
    </div>
    <div class="info" id="passageInfo">Loading passage...</div>
  </div>

  <div id="accessNotice" class="access-notice" role="alert" aria-live="assertive"></div>

  <div class="typing-area">
    <section class="paper-column">
      <div class="paper-heading">
        <span style="color:inherit;letter-spacing:normal;text-transform:none;font-size:14px">Original Passage</span>
        <span>READ ONLY</span>
      </div>
      <div class="paper-workspace">
        <div class="ruler-corner" aria-hidden="true"></div>
        <div class="horizontal-ruler" aria-hidden="true"></div>
        <div class="vertical-ruler" aria-hidden="true"></div>
        <div class="preview" id="preview">Checking your account...</div>
      </div>
    </section>

    <section class="paper-column">
      <div class="paper-heading">
        <span style="color:inherit;letter-spacing:normal;text-transform:none;font-size:14px">Your Typing</span>
        <span>STRICT MODE</span>
      </div>
      <div class="paper-workspace">
        <div class="ruler-corner" aria-hidden="true"></div>
        <div class="horizontal-ruler" aria-hidden="true"></div>
        <div class="vertical-ruler" aria-hidden="true"></div>
        <textarea id="input" spellcheck="false" autocomplete="off"
          autocorrect="off" autocapitalize="off"
          placeholder="Start typing here..." disabled></textarea>
      </div>
    </section>
  </div>

  <div class="buttons">
    <button id="startButton" type="button" disabled>Start Test</button>
    <button id="restartButton" type="button" disabled>Restart Same Passage</button>
    <button id="submitButton" type="button" disabled>Submit</button>
    <button id="toggleTypingBoxButton" type="button" disabled>Hide Typing Box</button>
  </div>

  <div id="wordCount" class="wordCount">0 / 0 words</div>
  <div id="keystrokeCount" class="wordCount">Keystrokes 0 / 0</div>
</div>

<script type="module">
import { supabase } from "./js/supabase.js";

const DAILY_LIMIT = 10;
const DAILY_LIMIT_MESSAGE = "Daily test limit reached. Please come back tomorrow.";

/* External passage collections selected from the dashboard. */
const passageFiles = {
  2400: "./2400-passage.js",
  2600: "./2600-passage.js",
  2800: "./2800-passage.js",
  3000: "./3000-passage.js"
};

let passages = {};

let currentPassageLimit = Number(
  localStorage.getItem("selectedKeystrokeLimit")
);

if (!Object.prototype.hasOwnProperty.call(
  passageFiles,
  currentPassageLimit
)) {
  currentPassageLimit = 2400;
}

const input = document.getElementById("input");
const timer = document.getElementById("timer");
const preview = document.getElementById("preview");
const accessNotice = document.getElementById("accessNotice");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");
const submitButton = document.getElementById("submitButton");
const toggleTypingBoxButton = document.getElementById("toggleTypingBoxButton");

let currentPassage = "";
let currentId = 0;
let timerStarted = false;
let testSubmitted = false;
let submissionInProgress = false;
let accessGranted = false;
let timeLeft = 600;
let interval = null;
let totalWords = 0;
let currentUser = null;

/* Load the JavaScript module for the selected keystroke collection. */
async function loadPassages(limit) {
  const file = passageFiles[limit];

  if (!file) {
    throw new Error("Invalid passage length selected.");
  }

  const passageModule = await import(file);

  if (
    !passageModule.passages ||
    typeof passageModule.passages !== "object" ||
    Object.keys(passageModule.passages).length === 0
  ) {
    throw new Error(`No passages found in ${file}`);
  }

  passages = passageModule.passages;
  currentPassageLimit = limit;
}

function showNotice(message) {
  accessNotice.textContent = message;
  accessNotice.classList.add("visible");
}

function clearNotice() {
  accessNotice.textContent = "";
  accessNotice.classList.remove("visible");
}

function countKeystrokes(text) {
  return [...text].length;
}

function countWords(text) {
  const cleaned = text.replace(/\t/g, " ").replace(/\n/g, " ").trim();
  return cleaned ? cleaned.split(/\s+/).filter(Boolean).length : 0;
}

function updateCounters() {
  document.getElementById("wordCount").textContent =
    `${countWords(input.value)} / ${totalWords} words`;

  document.getElementById("keystrokeCount").textContent =
    `Keystrokes ${countKeystrokes(input.value)} / ${countKeystrokes(currentPassage)}`;
}

function setTypingControlsEnabled(enabled) {
  input.disabled = !enabled;
  startButton.disabled = !enabled;
  restartButton.disabled = !enabled;
  toggleTypingBoxButton.disabled = !enabled;
  submitButton.disabled = !enabled || submissionInProgress;
}

function stopTimer() {
  if (interval !== null) {
    clearInterval(interval);
    interval = null;
  }
}

function getIndiaDayBounds() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const part = type => parts.find(item => item.type === type).value;
  const day = `${part("year")}-${part("month")}-${part("day")}`;
  const start = new Date(`${day}T00:00:00+05:30`);
  const end = new Date(start.getTime() + 86400000);

  return {
    start: start.toISOString(),
    end: end.toISOString()
  };
}

async function signOutAndRedirect(reason) {
  accessGranted = false;
  setTypingControlsEnabled(false);
  stopTimer();

  try {
    await supabase.auth.signOut();
  } catch (error) {
    console.error("Sign-out failed:", error);
  }

  window.location.replace(
    reason === "expired"
      ? "./index.html?status=subscription_expired"
      : "./index.html"
  );
}

async function initializeAccess() {
  try {
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      window.location.replace("./index.html");
      return;
    }

    currentUser = sessionData.session.user;

    const { data, error } =
      await supabase.rpc("ensure_my_subscription");

    if (error) throw error;

    const sub = Array.isArray(data) ? data[0] : data;

    if (!sub) {
      throw new Error("Subscription information is unavailable.");
    }

    const expiry = new Date(sub.subscription_expires_at);

    if (
      sub.is_expired ||
      !Number.isFinite(expiry.getTime()) ||
      expiry.getTime() <= Date.now()
    ) {
      await signOutAndRedirect("expired");
      return;
    }

    const bounds = getIndiaDayBounds();

    const { count, error: countError } = await supabase
      .from("test_results")
      .select("id", { count: "exact", head: true })
      .eq("user_id", currentUser.id)
      .gte("created_at", bounds.start)
      .lt("created_at", bounds.end);

    if (countError) throw countError;

    if ((count || 0) >= DAILY_LIMIT) {
      preview.textContent = DAILY_LIMIT_MESSAGE;
      showNotice(DAILY_LIMIT_MESSAGE);
      setTypingControlsEnabled(false);
      return;
    }

    /*
     * Load passages only after authentication, subscription,
     * and the existing daily-limit check have passed.
     */
    try {
      await loadPassages(currentPassageLimit);
    } catch (error) {
      console.error("Passage loading failed:", error);

      preview.textContent = "Unable to load the selected passages.";

      showNotice(
        `Could not load the ${currentPassageLimit}-keystroke passage file. Check that the file exists and try refreshing.`
      );

      setTypingControlsEnabled(false);
      return;
    }

    accessGranted = true;
    setTypingControlsEnabled(true);
    prepareTest();

  } catch (error) {
    console.error("Access verification failed:", error);
    setTypingControlsEnabled(false);
    preview.textContent = "Unable to verify your account.";

    showNotice(
      "Unable to verify your subscription. Check your connection and refresh the page."
    );
  }
}

function prepareTest() {
  if (!accessGranted || !currentUser || submissionInProgress) return;

  stopTimer();

  timer.textContent = "10:00";
  timeLeft = 600;
  timerStarted = false;
  testSubmitted = false;

  clearNotice();

  /*
   * Keep separate recent-passage histories for each collection.
   * Passage ID 1 in the 2400 collection is independent of ID 1
   * in the 2600, 2800, and 3000 collections.
   */
  const historyKey = `recentPassages_${currentPassageLimit}`;

  const history = JSON.parse(
    localStorage.getItem(historyKey) || "[]"
  );

  const ids = Object.keys(passages).filter(
    id => !history.includes(id)
  );

  const usable = ids.length ? ids : Object.keys(passages);

  currentId = usable[Math.floor(Math.random() * usable.length)];
  currentPassage = passages[currentId];

  history.push(currentId);

  if (history.length > 25) {
    history.shift();
  }

  localStorage.setItem(historyKey, JSON.stringify(history));

  preview.textContent = currentPassage;

  document.getElementById("passageInfo").textContent =
    `Passage #${currentId} · ${currentPassageLimit} keystrokes`;

  totalWords = countWords(currentPassage);

  input.value = "";
  input.disabled = false;
  submitButton.disabled = false;
  startButton.disabled = false;
  restartButton.disabled = false;
  toggleTypingBoxButton.disabled = false;

  updateCounters();
  input.focus();
}

function restartSame() {
  if (!accessGranted || submissionInProgress || testSubmitted) return;

  stopTimer();

  timer.textContent = "10:00";
  timeLeft = 600;
  timerStarted = false;

  input.disabled = false;
  submitButton.disabled = false;
  input.value = "";

  clearNotice();
  updateCounters();
  input.focus();
}

function startTimer() {
  if (interval !== null || testSubmitted || submissionInProgress) return;

  interval = setInterval(() => {
    timeLeft = Math.max(0, timeLeft - 1);

    timer.textContent =
      String(Math.floor(timeLeft / 60)).padStart(2, "0") + ":" +
      String(timeLeft % 60).padStart(2, "0");

    if (timeLeft <= 0) {
      stopTimer();
      input.disabled = true;
      submitTest();
    }
  }, 1000);
}

input.addEventListener("keydown", event => {
  if (!accessGranted || testSubmitted || submissionInProgress) {
    event.preventDefault();
    return;
  }

  if (
    ["Backspace", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]
      .includes(event.key)
  ) {
    event.preventDefault();
  }

  if (event.ctrlKey || event.metaKey) {
    event.preventDefault();
  }

  if (event.key === "Tab") {
    event.preventDefault();

    const start = input.selectionStart;
    const end = input.selectionEnd;

    input.value =
      input.value.substring(0, start) +
      "\t" +
      input.value.substring(end);

    input.selectionStart = input.selectionEnd = start + 1;

    input.dispatchEvent(new Event("input", { bubbles: true }));
  }
});

input.addEventListener("paste", event => event.preventDefault());

input.addEventListener("input", () => {
  if (!accessGranted || testSubmitted || submissionInProgress) return;

  if (!timerStarted && input.value.length > 0) {
    timerStarted = true;
    startTimer();
  }

  updateCounters();
});

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function tokenize(text) {
  text = text
    .replace(/\r/g, "")
    .replace(/[ ]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();

  return text.match(
    /\t|\n+|[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*|[.,!?;:%()[\]]/g
  ) || [];
}

function alignAndCount(original, typed) {
  const a = tokenize(original);
  const b = tokenize(typed);

  const m = a.length;
  const n = b.length;

  const dp = Array.from(
    { length: m + 1 },
    () => Array(n + 1).fill(0)
  );

  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;

  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i - 1] === b[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = Math.min(
          dp[i - 1][j],
          dp[i][j - 1],
          dp[i - 1][j - 1]
        ) + 1;
      }
    }
  }

  let i = m;
  let j = n;

  const alignedA = [];
  const alignedB = [];

  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift(b[j - 1]);
      i--;
      j--;
    } else if (
      i > 0 &&
      j > 0 &&
      dp[i][j] === dp[i - 1][j - 1] + 1
    ) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift(b[j - 1]);
      i--;
      j--;
    } else if (
      i > 0 &&
      dp[i][j] === dp[i - 1][j] + 1
    ) {
      alignedA.unshift(a[i - 1]);
      alignedB.unshift("∅");
      i--;
    } else {
      alignedA.unshift("∅");
      alignedB.unshift(b[j - 1]);
      j--;
    }
  }

  return { alignedA, alignedB };
}

function formatToken(token) {
  if (token === "\n" || token === "\n\n") return "<br><br>";
  if (token === "\t") return "&nbsp;&nbsp;&nbsp;&nbsp;";
  return escapeHTML(token) + " ";
}

function calculateResult() {
  const typed = input.value;

  const { alignedA, alignedB } =
    alignAndCount(currentPassage, typed);

  let correct = 0;
  let errors400 = 0;
  let errors = 0;
  let wordCounter = 0;
  let originalHTML = "";
  let typedHTML = "";

  for (let i = 0; i < alignedA.length; i++) {
    const o = alignedA[i];
    const t = alignedB[i];

    if (o === t) {
      correct++;

      if (o !== "∅" && /^[A-Za-z0-9]+$/.test(o)) {
        wordCounter++;
      }

      originalHTML += formatToken(o);
      typedHTML += formatToken(t);

    } else {
      if ((o === "\n" || o === "\n\n") && t === "∅") {
        continue;
      }

      errors++;

      if (wordCounter < 400) {
        errors400++;
      }

      if (o !== "∅" && /^[A-Za-z0-9]+$/.test(o)) {
        wordCounter++;
      }

      if (o === "∅") {
        originalHTML += '<span class="dim">∅</span> ';
        typedHTML +=
          `<span class="extra">${escapeHTML(t)}</span> `;
      } else if (t === "∅") {
        originalHTML +=
          `<span class="missing">${escapeHTML(o)}</span> `;
        typedHTML += '<span class="dim">∅</span> ';
      } else {
        originalHTML +=
          `<span class="red">${escapeHTML(o)}</span> `;
        typedHTML +=
          `<span class="red">${escapeHTML(t)}</span> `;
      }
    }
  }

  const accuracy =
    ((correct / alignedA.length) * 100 || 0).toFixed(2);

  const elapsedSeconds = Math.max(0, 600 - timeLeft);
  const minutes = elapsedSeconds / 60 || 1;

  const gross = ((typed.length / 5) / minutes).toFixed(2);
  const net = (gross * (accuracy / 100)).toFixed(2);

  const score400 =
    Math.max(0, 20 - errors400 * 0.25).toFixed(2);

  const score =
    Math.max(0, 20 - errors * 0.25).toFixed(2);

  originalHTML = originalHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  typedHTML = typedHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  return {
    gross: Number(gross),
    net: Number(net),
    accuracy: Number(accuracy),
    errors400,
    errors,
    score400: Number(score400),
    score: Number(score),
    durationSeconds: elapsedSeconds,
    wordsTyped: countWords(typed),
    keystrokes: countKeystrokes(typed),
    originalHTML,
    typedHTML,
    givenPassage: currentPassage,
    typedPassage: typed
  };
}

async function submitTest() {
  if (
    !accessGranted ||
    !currentUser ||
    testSubmitted ||
    submissionInProgress
  ) {
    return;
  }

  if (!currentPassage) {
    showNotice("Please start a test first.");
    return;
  }

  submissionInProgress = true;

  stopTimer();

  input.disabled = true;
  startButton.disabled = true;
  restartButton.disabled = true;
  submitButton.disabled = true;
  toggleTypingBoxButton.disabled = true;

  clearNotice();
  showNotice("Submitting your result securely...");

  try {
    const {
      data: sessionData,
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      await signOutAndRedirect("login");
      return;
    }

    const {
      data: subData,
      error: subError
    } = await supabase.rpc("ensure_my_subscription");

    if (subError) throw subError;

    const sub = Array.isArray(subData) ? subData[0] : subData;

    if (
      !sub ||
      sub.is_expired ||
      new Date(sub.subscription_expires_at).getTime() <= Date.now()
    ) {
      await signOutAndRedirect("expired");
      return;
    }

    const result = calculateResult();

    const { data, error } = await supabase.rpc(
      "submit_typing_result",
      {
        p_passage_label: `Passage #${currentId}`,
        p_gross_wpm: result.gross,
        p_net_wpm: result.net,
        p_accuracy: result.accuracy,
        p_errors_400: result.errors400,
        p_errors_total: result.errors,
        p_score_400: result.score400,
        p_score_total: result.score,
        p_duration_seconds: result.durationSeconds,
        p_words_typed: result.wordsTyped,
        p_keystrokes: result.keystrokes
      }
    );

    if (error) {
      const message = String(error.message || "").toUpperCase();

      if (message.includes("SUBSCRIPTION_EXPIRED")) {
        await signOutAndRedirect("expired");
        return;
      }

      if (message.includes("DAILY_LIMIT_REACHED")) {
        accessGranted = false;
        setTypingControlsEnabled(false);
        showNotice(DAILY_LIMIT_MESSAGE);
        return;
      }

      if (
        message.includes("AUTHENTICATION_REQUIRED") ||
        message.includes("JWT") ||
        message.includes("NOT AUTHENTICATED")
      ) {
        await signOutAndRedirect("login");
        return;
      }

      if (message.includes("SUBSCRIPTION_NOT_INITIALIZED")) {
        showNotice(
          "Your subscription could not be initialized. Please return to the dashboard and try again."
        );
        return;
      }

      console.error("Result submission failed:", error);

      showNotice(
        "Your result could not be saved. It has not been accepted. Check your connection and try submitting again."
      );

      return;
    }

    if (data?.accepted !== true || !data.result_id) {
      showNotice(
        "The database did not confirm acceptance. Your result has not been redirected."
      );
      return;
    }

    const comparison = {
      resultId: data.result_id,
      givenPassage: result.givenPassage,
      typedPassage: result.typedPassage,
      originalHTML: result.originalHTML,
      typedHTML: result.typedHTML,
      savedAt: new Date().toISOString()
    };

    try {
      localStorage.setItem(
        "latestTypingComparison",
        JSON.stringify(comparison)
      );
    } catch (storageError) {
      console.error("Could not save comparison:", storageError);
      localStorage.removeItem("latestTypingComparison");
    }

    testSubmitted = true;

    window.location.replace(
      `./result.html?id=${encodeURIComponent(data.result_id)}`
    );

  } catch (error) {
    console.error("Submission error:", error);

    showNotice(
      "An unexpected error occurred. Your result has not been confirmed as saved."
    );

  } finally {
    submissionInProgress = false;

    if (!testSubmitted && accessGranted) {
      input.disabled = true;
      submitButton.disabled = false;
      toggleTypingBoxButton.disabled = false;
    }
  }
}

function toggleTypingBox() {
  const hidden = input.classList.toggle("typing-box-hidden");

  toggleTypingBoxButton.textContent =
    hidden ? "Show Typing Box" : "Hide Typing Box";

  if (hidden) input.focus();
}

window.addEventListener("contextmenu", event => event.preventDefault());

startButton.addEventListener("click", prepareTest);
restartButton.addEventListener("click", restartSame);
submitButton.addEventListener("click", submitTest);
toggleTypingBoxButton.addEventListener("click", toggleTypingBox);

supabase.auth.onAuthStateChange(event => {
  if (event === "SIGNED_OUT" && accessGranted) {
    accessGranted = false;
    window.location.replace("./index.html");
  }
});

setTypingControlsEnabled(false);
initializeAccess();
</script>
</body>
