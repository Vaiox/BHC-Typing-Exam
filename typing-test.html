\tPrivate property cannot under the Constitution be acquired or allotted for private purposes though an enabling power like that contained in sub-section (I) of section 23 may be exercised in cases where the common good dictates the distribution of excess vacant land to an industry, as defined in clause (b)of the Explanation to Section 23. Sub-section (I) of section 27 of the Act is invalid insofar as it imposes a restriction on transfer of any urbanisable land with a building or a portion only of such building, which is within the ceiling area. Such property will therefore be transferable without the constraints mentioned in sub-section (I) of Section 27 of the Act. Nothing usefully can be added to the Judgment delivered by Krishna Iyer, J and the reasons given therein are fully agreed to. Article 39(b) and(c) of the Constitution are directly attracted and the fullest exploitation of the material resources of the community undoubtedly requires distribution of urban land geared to the common good.

\tSub-sections (2) and(3) of Section 23 and the opening words subject to the provisions of sub-sections (1), (2) and (3) "in section 23(4) of the Urban Land (Ceiling and Regulation) Act, 1976 are ultra vires of the Parliament and these provisions are not protected under Article 31-B and 31-C of the Constitution. Sub-section (1) of section 27 of the Act is invalid in so for as it imposes a restriction of transfer of urban property for a period of ten years from the commencement of the Act, in relation to vacant land or building thereon, within the ceiling limits. Sub-sections (1), (2) and (3) of section 23 and the opening words "subject to the provisions of sub-sections (1), (2) and (3) in sub-section (4) of section 23 are ultra vires of the Parliament.`,

24:`\tBriefly stated, the prosecution case is that on 08.03.1979, at about 6.30 p.m., the informant Laxmikant Bajpayee was returning to his house from village Pauli Bazar and, on reaching near his chak within the limits of village Ajai, P.S. Khaga, District Fatehpur, the accused Phool Singh and Ajaipal Singh emerged from the bushes of moonj standing in the field. Phool Singh is alleged to have "belaboured" the informant with a lathi, and at his instigation, the appellant Ajaipal Singh fired a pistol shot at the informant with intent to kill him, causing him firearm injury on the left side of the abdomen. On hearing his cries, PW-2 Krishna Pal Singh and one Suresh Singh, who were returning from "Pauli Bazar", reached the spot and attempted to apprehend the accused, but on being threatened by the appellant, they could not do so, whereupon the accused fled the scene. The injured was thereafter taken to the police station in a bullockcart by his elder brother Kamlesh Babu and grand-uncle Ram Babu, where the F.I.R. (Ext. Ka.2) came to be lodged at about 8.00-8.30 p.m. He was medically examined by Dr. D.C. Rai (PW-1), who found, inter alia, a fire-arm injury on the left side of the upper abdomen and other simple injuries attributable to a blunt weapon.

\tOn completion of investigation, charge-sheet was submitted against both accused, and they were committed to the Court of Sessions to stand trial under Section 307/34 IPC. Charges were framed on 03.03.1983, to which the accused pleaded not guilty. In their statements under Section 313 Cr.P.C., recorded when the appellant Ajaipal Singh was about 24 years of age, both accused took the plea of false implication on account of pre-existing "enmity" and "litigation" between their family and that of the informant's grand-father, Ram Babu.

\tThe prosecution examined five witnesses, including Dr. D.C. Rai (PW-1), the injured informant Laxmikant (PW-2), and the eye-witness Krishna Pal (PW-3), besides formal witnesses. Upon appraisal of the ocular, medical and documentary evidence, the learned trial court found the prosecution case fully established and convicted both accused under Section 307/34 IPC, sentencing each to seven years' rigorous imprisonment vide judgment dated 3.6.1983, which is under challenge in the present appeal.

\tMr. Roy Chacko referred to the decision of the Division Bench of this court in Chacko Daniels case (supra). The Bench had taken the view that "the personal law relating to Christians in Travancore-Cochin does not make a father legally liable to maintain his children whether they be legitimate or illegitimate." For this conclusion, the Bench had placed reliance on Stephen's Commentaries on the Laws of England (19th Edition). Mr. Joseph submitted that the decision is per incuriam. The matter is partly governed by the Travancore Special Marriage and Succession Act, 1119 (1944 of the Christian era). He appears to be right. Still more, the counsel referred to the provisions of the Kerala Children Act, 1972.`,

25:`\tThis Criminal Appeal, under Section 374 (2) of Code of Criminal Procedure, 29/05/1973 (in short Cr.P.C.), has been filed by the appellants, Raghuraj Singh, Amar Pal Singh, Mohar Pal Singh, Brij Pal Singh and Ram Pal Singh, against the impugned judgment and order dated 04.12.1982, passed by Sri Sanwal Singh, the then III Additional Sessions Judge, Etah, in Sessions Trial No. 385 of 1982, arising out of Case Crime No. 79 of 1982, Sections 148, 307 Indian Penal Code,1860 (in short IPC) Police Station Sidhpura, District Etah.

\tBy the impugned judgment and order, the Trial Court has convicted the appellants for offence punishable under Section 148 IPC and sentenced them to undergo a rigorous imprisonment of one year and for offence punishable under Section 307 IPC, they were directed to undergo a rigorous imprisonment of seven years. It was also directed that both the sentences shall run concurrently.During the pendency of this appeal, appellants nos.1 to 4, to wit, Raghuraj Singh, Amar Pal Singh, Mohar Pal Singh, Brij Pal Singh, have died and this appeal has abated against them vide order dated 06.01.2026 passed by this Court. Now, this appeal survives on behalf of appellant no.5, Ram Pal Singh, alone.

\tBrief facts of the case are that Kaptan Singh, resident of Moiddipur, Police Station Sidhpura, District Etah, filed a written application (Tehrir) (Ext. Ka-1), before In-Charge, Police Station Sidhpura, stating therein that one day prior to the incident, the first informant and Jhabboo Singh had returned home after obtaining bail in a proceedings under Section 107/116 Cr.P.C. It was further stated that today, i.e. 10.07.1982 at about 05:30 a.m., the first informant and Jhabboo Singh had gone for defecation near a river situated towards the south-west of the village. Atar Singh, Netrapal Singh, Vishwanath and Sher Singh had also come for defecation. Then his co-villagers/ appellants, Raghuraj Singh, Amar Pal Singh and Jai Narain carrying illegal guns and Mohar Pal, Brij Pal and Ram Pal Singh having country made pistols (Tamancha) arrived there and exhorted Jhabboo Singh that he would not escape today and opened fire at him. Jhabboo Singh raised alarm, whereupon the first informant and others ran towards the place of occurrence. Some of the co-villages also reached at the spot, upon which the accused ran towards the west. Jhabboo Singh sustained injuries over his shoulder and other parts of the body, whom they had brought in a vehicle at the Police Station.

\tThe Mappila Succession Act (Madras Act 1 of 1918), applied the rules of Mohammedan Law to intestate succession among Mapplias. Dut the explanation to Section 2 of the said Act excluded tarwad property from its operation unless the person dying intestate was exclusively entitled to it. The Mappila Wills Act of 1928 (Madras Act 7 of 1928) applied the Mohammedan Law to the testamentary dispositions of Mappilas governed by the Marumakkathayam Law, in respect of property covered by the Mappila Succession Act of 1918.`,

26:`\tLet this writ petition be de-tagged from Criminal Misc. Writ Petition No. 20611 of 2025, as we find that there are no common questions of facts and law involved, and both related to completely different history-sheets. This writ petition is directed against the order dated 27.02.2020 passed by the Senior Superintendent of Police, Prayagraj, approving the opening of a B-Class history sheet against the petitioner as well as the history sheet opened on the basis of the said order, annexed as Annexure No.1 to the writ petition. The petitioner prays that the order of the Senior Superintendent of Police, granting approval to the opening of a B-Class history sheet against him as well as the history sheet, be quashed.

\tThe petitioner says that the Station House Officer, Police Station Meja, District Prayagraj, on 19/02/2020 submitted a report to the Circle Officer, Meja, District Prayagraj, proposing the opening of a history sheet against him. The Circle Officer, Meja, District Prayagraj, on the same date, recommended the matter to the Superintendent of Police, Yamunapar, District Prayagraj. The Superintendent of Police, Yamunapar, Prayagraj also recommended the opening of a history sheet against the petitioner on 19.02.2020 to the Senior Superintendent of Police, Prayagraj. The Senior Superintendent of Police, Prayagraj approved the opening of a history sheet by means of his order dated 27/02/2020.

\tThe petitioner has detailed his history of eight crimes registered against him, which is as follows. The petitioner says that on the basis of the impugned order passed by the Senior Superintendent of Police, Prayagraj dated 27.02.2020, a history sheet for the petitioner has been opened in Class-B, bearing no. B-26, relating to Police Station Meja, District Prayagraj. It is the petitioner's case that he had no knowledge of the aforesaid history sheet opened by the respondents and came to know of the fact for the first time on 10.07.2025, when a Constable from Police Station Meja informed him about the opening of the impugned history sheet. The petitioner contacted the Station House Officer and requested him to provide papers relating to opening of the history sheet. It is in this manner that he was provided a photostat copy of the history sheet together with the endorsements of approval etc. carried thereon. It is next asserted by the petitioner that a perusal of the history sheet shows that the conduct of the petitioner has been under surveillance from 2020 to 2024.

\tThe petitioner, Parameswaran Nambudiripad, is a member of Poomuli Mana consisting of a Nambudiri family in Kerala State and the members of the Mana were governed by the Madras Nambudiri Act, 1932 (Act 21 of 1933). Now they are governed by the Kerala Nambudiri Act, 1958 (Act 27 of 1958). The members of the family own considerable items of agricultural lands in Malabar and in the erstwhile Travancore-Cochin State.`,

28:`\tHeard Shri Rajesh Kumar Dwivedi, learned Amicus Curiae appearing for the appellant, learned AGA for the State and perused the trial court record. The instant criminal appeal has been filed by the appellant against the judgment and order dated 05.04.2002 passed by Additional Sessions Judge, Fast Track Court, Court No.5, Hardoi in Sessions Trial No. 544 of 2001 (State vs. Pooran), arising out of Case Crime No. 113 of 2001, under Section 376 IPC, Police Station Baghauli, District Hardoi, whereby appellant- Pooran has been convicted for the offence under Section 376 IPC and awarded the sentence of life imprisonment.

\tShorn of unnecessary details, the prosecution story as stated in the FIR is that one Shree Ram, son of Chhotta, permanent resident of Village Ummar Pur Majra Behta Murtaja Bakhsh, Police Station Baghauli, District Hardoi, stated that on 11.05.2001 at 11:00 AM, his daughter X (victim) was playing at his door-step, when Pooran, resident of the same village, reached there and on the pretext of plucking the mangoes, had taken her in the mango grove of one Niranjan and finding it to be a desolate place, where Pooran committed the offence of rape upon his daughter. On alarm raised by his daughter, he alongwith one Chhotey Lal, who were present in the vicinity, reached the mango grove, seeing them, Pooran, who was committing the offence of rape upon his daughter, ran away. His daughter, soaked in blood, was lying there. On the basis of the aforesaid allegations, a written report was drawn by one Jai Ram and thereafter, alongwith the written report, Shree Ram reached at the Police Station Baghauli and gave the written report (Tehreer) to the Head Moharrir to lodge his report.

\tOn the basis of the written report, marked as Exhibit Ka-1, the FIR has been lodged (marked as Exhibit Ka-2) vide Case Crime No. 113 of 2001, under Section 376 IPC, Police Station Baghauli, District Hardoi, carbon copy whereof has been drawn vide G.D. Report No. 21 at 19:20 hours dated 11.05.2001, which has been proved and marked as Exhibit Ka-3. After registration of the aforesaid FIR, the Head Moharrir had taken in his possession the undergarment of the victim, which was sealed by Constable Clerk Bachchu Singh and its recovery memo was prepared in presence of the first informant Shree Ram, Nand Lal and Shiv Ram. The said recovery memo has been proved and marked as Exhibit Ka-4.

29:`\tThe present criminal appeal has been filed against the judgment and order dated 24.7.1985, passed in Session Trial No. 301 of 1984 by learned Special Judge (DAA), Kanpur Dehat convicting and sentencing the appellants under Sections 392 IPC to undergo RI for five years and fine of Rs. 1000/. Learned counsel for the appellants has submitted that the appellants were not named in the FIR. They have been arrested on the statement of the informer. There is only recovery of one Kambal and one Mosquito net from appellant Chhotey and Ram Balak, respectively. They are easily available in the market. There is no iota of evidence against the appellants/accused. Neither any weapon nor any "incriminating material", arms has been recovered from the appellants/accused persons. There was no source of light at the time of commission of offence.

\tThe finding recorded by the learned trial court is perverse and the impugned judgment and order is liable to be set aside. The appellants are entitled to be acquitted and the appeal is liable to be allowed. On the other hand, learned AGA has opposed the appeal and he submitted that the prosecution witnesses has fully supported the prosecution story. Even the victim had recognized their belongings which were looted. There was proper identification parade done and the accused/appellants was duly identified. The appellants have committed a serious and heinous offence.

\tThe criminal appeal is liable to be dismissed. Learned counsel for the appellant has relied on the law laid down by the Supreme Court in Iqbal and another Vs. State of U.P.; 2015 LawSuit(SC) 445. He has submitted that the evidence of identification of the miscreants in the test identification parade is not a 'substantive' evidence. Conviction cannot be based solely on the identity of dacoits by the witnesses in the test identification parade. The prosecution has to adduce substantive evidence by establishing "incriminating evidence" connecting the accused with the crime, like recovery of articles which are subject matter of dacoity and the alleged weapon used in the commission of the offence. He has further relied on the law laid down by the 'Supreme Court' in (Satrughana alias) Sastrughan Parida Vs. State of Orissa; 1992 Law Suit (SC) 829. He has relied that identification parade was held on 10.12.1982 i.e. more than 15 days after the arrest of Rabin Kandy and almost a month after the arrest of the other two accused.

\tThe prosecution has not advanced any reason for not holding the identification parade promptly. Again the department issued a notice dated February 9, 1960, under Section 35 of the Agricultural Income-tax Act, 1950, proposing to assess the petitioner in the status of Hindu undivided family for the assessment year 1959-60. The notice was quashed in O.P. No. 750 of 1960 by Vaidialingam J. by the judgment dated January 3, 1961, on the ground that it is against the undertaking given by the Government Pleader in O.P. No. 340 of 1959. The decision in O.P. No. 750 of 1960 was confirmed in Writ Appeal No. 76 of 1961.`,

30:`\tHeard learned counsel for appellant and learned Additional Government Advocate for respondent No.1/State. As per CJM report dated 14.07.2026, respondent No.2 (complainant) has been duly served, but has not put in appearance. Counter affidavit on behalf of State, rejoinder affidavit thereto and supplementary affidavit on behalf of appellant filed today are taken on record. This Criminal Appeal has been filed by the appellant under Section 14-A(2) of the Scheduled Castes and the Scheduled Tribes (Prevention of Atrocities) Act, 1989 [here-inafter referred to as 'SC/ST Act'] with a prayer to set aside order dated 15.05.2026 passed by Special Judge (SC/ST Act), Ayodhya/Faizabad on Computer Registration No.561/2026 arising out of Case Crime No.162 of 2026, under Sections 191(2), 115(2), 352, 351(3), 310(2), 316(2), 111(2)(b), 61(2)(a) BNS & Sections 3(2)V of the SC/ST Act, Police Station Purakalandar, District Ayodhya/Faizabad rejecting bail to appellant.

31:`\tApplication has been filed seeking recall of judgment and order dated 09.04.2024. Heard learned counsel for applicant and Mr.Raj Kumar Singh, learned Counsel for Union of India. It has been submitted by learned counsel for applicant that the claim petition, which was filed on behalf of Workman Radhey by the Association, raised challenge to the action of administration of North Eastern Railway, Lucknow in not granting him temporary status on 31/07/1977 and not granting full length of service under the existing Rules.

\tIt is submitted that by means of judgment and order dated 09.04.2024, the entire Award has been upheld, although the discussion is only with regard to validity of scheme under the Liberalized Active Retirement Scheme for Guaranteed Employment for Safety Staff (LARSGESS) and therefore it is submitted that allowing the writ petition in toto would affect the service benefits which have been granted by the Tribunal. Learned Counsel for Union of India has submitted that the Award of Tribunal pertained to the claims as made in the claim petition, which also included service benefits being sought by the said Radhey and included a prayer for appointment of his son under the said Scheme. It is submitted that the Award impugned in the writ petition has granted all reliefs as prayed for in the claim petition. After hearing learned counsel for parties, the application for recall is hereby being treated as an application for modification of the judgment and order dated 09.04.2004 since learned counsel for applicant submits that he is not raising any plea with regard to judgment on merits.

\tFrom the record, it appears that the claim petition had been filed by the Association on behalf of Workman Radhey. A copy of the claim petition has been brought on record as Annexure - 32 to the writ petition and the prayer clause clearly indicates that apart from seeking appointment for his son, the Workman Radhey also challenged the action of administration of North Eastern Railway, Lucknow in not affording him temporary status on 31.07.1977 and not granting full length of service under the existing Rules. A perusal of the judgment and order dated 09/04/2024 further reveals that writ petition had been allowed solely on the aspect of entitlement of the claim petitioner for appointment of his son under the said Scheme.

\tThere is no discussion with regard to service benefits being sought by the workman but the writ petition has been allowed in toto. Be it mentioned herein that W.D. Whitney has transalated these Holy Spellss word by word which has made said transalation obscure. For example he has transalated word "Aashtachakra" as "eight wheeled" while "Aashtachakra" has been translated as "Ashtapadakara" by Sri Valmiki in Ramayana English translation whereof published by Sri Gita Press Gorakhpur is " like Dice Board" i.e. octagonal. The rationale of image worship is thus given in a verse which is quoted by Raghunandan.`,

32:`\tAs per contents of first information report, which has been lodged against unidentified person, incident is said to have taken place on 29.12.2022 at about 09.30 A.M, 70 years old mother of the informant went to the fields to relief herself and did not return. It is alleged that subsequently her body was found on 30/12/2022. Learned counsel for applicant submits that he has been falsely implicated in allegations levelled against him which could be evident from the fact that there is no eye witness or even last seen evidence against the applicant and has been taken into custody only on the basis of alleged confessional statement. It is submitted that previous criminal history of five cases duly explained and applicant is under incarceration since 09.02.2023 with four prosecution witnesses of fact having already been examined.

\tLearned Additional Government Advocate appearing on behalf of State has opposed the bail application but does not dispute the fact that applicant has been taken into custody on the basis of confessional statement. Hon'ble the Supreme Court in Sanjay Chandra v. Central Bureau of Investigation, reported in (2012) 1 SCC 40 has specifically held that bail is to be a norm and an under-trial is not required to be in jail for ever pending trial. Relevant paragraphs of the judgment are as under :- In bail applications, generally, it has been laid down from the earliest times that the object of bail is to secure the appearance of the accused person at his trial by reasonable amount of bail. The object of bail is neither punitive nor preventative.

\tDeprivation of liberty must be considered a punishment, unless it is required to ensure that an accused person will stand his trial when called upon. The courts owe more than verbal respect to the principle that punishment begins after conviction, and that every man is deemed to be innocent until duly tried and duly found guilty." This Court, time and again, has stated that bail is the rule and committal to jail an exception. It has also observed that refusal of bail is a restriction on the personal liberty of the individual guaranteed under Article 21 of the Constitution." Considering the submissions advanced by learned counsel for the parties and upon perusal of material on record, prima facie, and subject to further evidence being led in trial, it appears that except for the confessional statement in custody of the applicant. This case was argued at length on 30.8.2005.

\tCounsel appearing for the appellant had relied upon a judgment of this Court in N.V. Srinivasa Murthy v. Mariyamma (2005) 5 SCC 548 : (AIR 2005 SC 2897) for the proposition that a plaint could be rejected if the suit is ex facie barred by limitation.  As against this, counsel for the respondents relied upon a later judgment of this Court in Popat and Kotecha Property v. SBI Staff Assn.(2005) 7 SCC 510. in respect of the proposition that Order 7, Rule 11(d) was not applicable in a case where a question has to be decided on the basis of fact that the suit was barred by limitation.`,

35:`\tIs a Christian father under an obligation to maintain his minor child? More than three decades back, a Full Bench of this Court had considered this question in 'The Commissioner of Income Tax, Kerala v. P.M. Paily Pillai', 1972 KLT 24. Following an earlier decision of a Division Bench in Chacko Daniel v. Daniel Joshua, 1952 KLT 595, it was held that the duty of the father was an imperfect obligation. It was not an actionable wrong. Thus, it was concluded that "there is no legal obligation on the part of the Christian father to maintain his minor child". Accordingly, the question was answered in the negative. The correctness of this view was questioned in these two cases.

\tIt was pointed out that discordant notes had been struck after the decision in Paily Pillai's case. The issue was referred to a Full Bench. Initially, the matter was listed before a Bench of three Judges. However, in view of the fact that a Full Bench had already considered the matter, the case was placed before this Bench. The facts may be briefly noticed. On April 29, 1979, Ms. Rosamma and Mr. Mathew Varghese were married. After having stayed together for a few days, the wife had left for her place of work in Germany. The husband had visited Germany. On October 13, 1980, a son Mathew alias Tishan was prematurely delivered. In course of time, the relationship between the husband and wife had got strained. Even the paternity of the child appears to have become the cause of conflict between the parties.

\tIn the year 1987, Mrs. Rosamma alongwith her minor son and father (who was described as the next friend of the minor) filed a suit against her husband, Mr. Mathew Varghese. She alleged that at the time of the settlement of marriage, an amount of Rs. 25,000/- had been paid to the defendant by way of Streedhan. Thereafter, at the marriage, ornaments worth Rs. 25,000/- were also given. Subsequently, she had sent cheques for a total of Rs. 35,757.81 ps. to him for being kept in fixed deposit. The defendant had admitted vide his letter dated April 23, 1981 that he had kept Rs. 29399.81 ps. in the bank and that it would be refunded on dissolution of the marriage. She further claimed that the defendant was bound to support and look after the needs of the minor son. Thus, she made a claim for a total sum of Rs. 86,639.00. This included a sum of Rs: 14,400/- on account of maintenance of the minor child for a period of 36 months preceding the filing of the suit.

\tThe defendant contested the suit. It was inter-alia alleged that the first plaintiff had illicit relations with many persons. She had not conceived the child from him. Thus, he was under no obligation, legal or moral, to maintain him. He prayed that the suit be dismissed. The matter was placed before a learned Single Judge of this Court. On behalf of the plaintiff-respondents, reliance was placed on the decision in Joy v. Usha, AIR 1996 Kerala 191, wherein the claim of a Christian wife against her husband was sustained.`,

36:`\tDoes not the morality of the Bible embody the safety of the society? It lays down the way a Christian should lead his life. It is the 'Alpha and Omega, the beginning and the ending' of a good and humane existence. "Let the little children to come unto me, and forbid them not; for of such is the kingdom of God," is the Christian canon. Service to the creature is the best way to serve the Creator. This is the Christian faith. Can a Christian still ignore his child? History records that - "Christ forgot himself and provided for his mother amid the agonies of crucifixion". It has been said, "The only way to realize that we are God's children is to let Christ lead us to our Father". Still further, "The Christian faith reposes in a person Ulan a creed. Christ is the personal living center of theology. Christ is the personal source of the individual Christian life; the personal head of the whole Christian Church; the personal sovereign of the kingdom of grace".

\tMr. Radhakrishnan B. Thottathil pointed out, and we think rightly, that Section 9 of the Code of Civil Procedure provides a remedy for the enforcement of the civil rights by way of a civil suit. Order 32A specifically contemplates a suit for maintenance. The remedy is available to everyone, an infant or adult, irrespective of the race or religion, Still further, even when the parents are fighting, Sections 41 to 44 of the Indian Divorce Act, 1869, clearly regulate the exercise of jurisdiction by the Court regarding the custody and care of the children. In case of a minor, the law provides for the appointment of the 'next friend'. The obvious purpose is to ensure that the interest of the minor is duly protected. The fate of the children 'caught in the maelstrom of marital conflict' is a matter of concern. It has not to be "subordinated to the outcome of the marital legal battle". The law contained in Sections 41 to 44 of the 1869 Act, takes care of it. In view of these provisions, it cannot be said that the law does not impose a legally enforceable duty.

\tAnd then, let us assume that there is a custom that a father is not obliged to maintain a child. Such a custom shall be law, within the meaning of Article 13 of the Constitution. Would it not be violative of the right to life guaranteed under Article 21? The answer has to be in the affirmative. In fact, such a custom shall be contrary to the constitutional scheme as embodied in Articles 21, 23 to 27 and 39. Still further, the Constitution makes India a Secular State. We talk of a uniform civil code. Still, the litigants seek to distinguish the rights and duties on the basis of only religion. It is not permissible.

\tAggrieved by the judgment, the defendant filed an appeal viz., A.S. No. 167 of 1992. A cross appeal was filed by me plaintiffs. In the cross appeal, the claim for the amount of Rs. 25,000/- paid on April 22, 1979 and Rs. 14,400/- on account of maintenance of the minor son, was reiterated. It was also claimed that the defendant in the suit was liable to pay interest.`,

37:`\tThis is an original petition filed under Article 226 of the Constitution to issue a writ of prohibition against the respondent who is the Inspecting Assistant Commissioner of Agricultural Income Tax and Sales Tax (Special), Kozhikode, prohibiting him from taking further proceedings for assessing the petitioner as the manager of POomulli Mana in the status of a Hindu Undivided family to agricultural income tax for the assessment year 1961-62 pursuant to Ext. P-3 notice dated 10-3-1965 issued under Section 35 and Ext. P-3 notice issued under Section 17 (4) of the Agricultural Income Tax Act, 1950. The petitioner--Parameshwaran Namboodiripad--is a member of Poomuli Mana consisting of a Narnboodiri family in Kerala State and the members of the Mana were governed by the Madras Nambudiri Act, 1932 (Act 21 of 1933). Now thev are governed by the Kerala Nambudiri Act, 1958 (Act 27 of 1958).

\tThe members of the family own considerable items of agricultural lands in the Malabar and in the erstwhile Travancore-Cochin State. The area which originally formed the District of Malabar in the Madras State became part of the State of Kerala as and from 1-11-1956. The Travancore-Cochin Agricultural Income Tax (Amendment) Act, 1957 (Act 8 of 1957) amended the Travancore-Cochin Agricultural Income Tax Act, 1950, and extended the same to the whole of the Kerala State including the Malabar area with effect from 1-4-1957. The Agricultural Income Tax Authorities of the State attempted to assess the petitioner who was then the manager of the Illom in the status of Hindu undivided family to tax for the assessment year 1957-58 by the assessment order dated 12-2-1958.

\tThe assessment order was quash-td on 25-11-1958 in O. P. 178 of 1958 on the file of this court. On 30-3-1958 all the members of the Poomulli Mana including the petitioner entered into a registered partition deed under which they became divided and most of the properties belonging to the Mana were also divided by metes and bounds among them The petitioner ceased to be the manager of the family from 1-4-1958. Nevertheless, the Agricultural Income Tax Authorities issued notices to the petitioner under Sections 17 (2) and 39 of the Agricultural Income Tax Act, proposing to assess him as the manager of the family in the status of Hindu undivided Family for the assessment years 1957-58 and 1958-59.

\tThe petitioner challenged the validity of the notices in O. P. 340 of 1959 which was allowed by a division bench of this Court consisting of M.S. Menon and T.K. Joseph JJ. on 18-1-1960 observing thus: "The learned Government Pleader submits, quite categorically that the assessment proposed is of the petitioner as an 'individual,' and not in anv other capacity. In view of the submission we do not consider it necessary to proceed further in this petition. We record the fact that the Department does not propose to assess the petitioner except as an individual and leave him to seek his remedies under the Act or the Constitution in case he feels himself aggrieved by anv subsequent action of the Department".`,

38:`\tThis Criminal Appeal has been filed by the appellant under Section 14-A(2) of the Scheduled Castes and the Scheduled Tribes (Prevention of Atrocities) Act, 1989 with a prayer to set aside order dated 23.06.2026 passed by "Special Judge" (SC/ST Act), Lucknow in Bail Application No.3430 of 2026 arising out of Case Crime No.260 of 2026, under Sections 69, 115(2), 318(4), 351(3), 352 BNS & Section 3(2)V of the Scheduled Castes and the Scheduled Tribes (Prevention of Atrocities) Act, 1989, Police Station Chinhat, District Lucknow rejecting bail to appellant.

\tAs per contents of First Information Report, it is alleged that the appellant 'physically exploited' the informant on a false promise of marriage and subsequently the informant became aware that the appellant was in fact a Muslim person whereafter she stopped any interaction with him. It is stated that thereafter the appellant started to "threaten" and 'intimidate' the informant on the basis of obscene photos and videos, which he taken of the informant on his mobile phone and on that basis also extracted Rs.25,000/- from her whereafter he insult and chased her away. Allegation of assault upon family members of informant has also been made.

\tLearned counsel for appellant submits that he has been falsely implicated in allegations levelled against him which could be evident from the statement of cousin sister of the informant herself under Section 161 Cr.P.C. clearly indicating that the informant and her family members were perfectly aware about religion of the appellant and there is considerable difference between promise to marry which is false from the very inception and subsequent breach of promise. It is submitted that appellant without previous criminal history is under incarceration since 19.05.2026. Learned Additional Government Advocate has opposed the appeal with the submission that the aspects of false promise to marry from the very inception are clear not only from the contents of FIR but also from the statement of informant recorded under sections 180 and 183 BNSS. It is however admitted that nothing incriminating could be recovered from the mobile phone of the appellant and that he does not have any previous criminal history.

\tUpon consideration of submissions advanced by learned counsel for parties and perusal of material available on record, at this stage, without entering into the merits of case and subject to evidence in trial, it appears that although allegation has been levelled in the F.I.R. and the statements of informant of having deceived. The proposition I go by is supported by a crowd of decisions. To mention but a few, here are they: (1) Ram Ratan Sahu v. Mohant Sahu, (1907) 6 Cal LJ 74, (2) Ramyad Sahu v. Bin-deshwari Kumar Upadhay, (1907) 6 Cal LJ 102, (3) Rai Charan Mondal v. Biswanath Mondal. 20 Cal LJ 107 = (AIR 1915 Cal 103). (4) Annapurna Dasi v Sarat Chandra Bhatta-charjee , (5) Raja Kamala Ranjan Roy v. Baijnath Bajoria, (1949) 53 Cal WN 329, (6) Surinder Kumar v. Gian Chand 1958 SCA 412=(AIR) 1957 SC 875).`,

39: `\tHeard learned counsel for applicant, learned Additional Government Advocate for opposite party-State and Mr. Prabhu Sharan, learned counsel for complainant. First bail application has been filed by the applicant under Section 483 BNSS with regard to FIR No. 284/2025 under Sections 103(1), 238 BNS, Police Station Sandi, District Hardoi. As per contents of First Information Report, which only discloses a particular mobile, allegation levelled is that on 06.06.2025 at about 06.00 a.m., Sachin Kumar, younger son of informant went missing leaving behind his mobile and subsequently, a call was received on the said mobile by a particular mobile number demanding a sum of Rs.2,00,000/- [Rupees Two Lakhs only].

\tLearned counsel for applicant submits that applicant has been falsely implicated in allegations levelled against him which would be evident from the fact that the applicant is not named in the FIR and except for confessional statements, there is no concrete evidence against him. Learned counsel has drawn attention to the alleged recovery which also took place at the instance of a police informer. The same also indicates IMEI number of the mobile allegedly recovered from the applicant without the mobile number being indicated. It is submitted that the applicant is under custody since 09.06.2025 without any previous criminal history. Learned counsel for respondents have opposed bail with submission that the applicant has been taken into custody on the basis of CDR of the mobile which was recovered as well his confessional statement and the confessional statement of wife of deceased to the effect that they were having illicit affair due to which the son of informant was done to death.

\tLearned Additional Government Advocate however admits that the applicant does not have any previous criminal history. Upon consideration of submissions advanced by learned counsel for parties and perusal of material on record, at this stage, without entering into the merits of case and subject to evidence in trial, it appears that FIR has been lodged without naming anybody and only indicating the mobile number from which an alleged call was received on the mobile of the deceased demanding a sum of Rs.2,00,000/- [Rupees Two Lakhs only]. At this stage, it appears that the applicant is under custody only on the basis of alleged confessional statements, the evidentiary value which would require to be judged by trial court with evidence.

\tThe alleged recovery of offending mobile phone does not indicate any mobile number except IMEI number. "Recently the question came before the Allahabad High Court in Ram Singh v. State, AIR 1963 All 355 , before the Calcutta High Court in Mahabir Agarwalla v. Gita Roy [1962] 2 Cr. L.J.528 and before the Patna High Court in Nalini Ranjan v. Kiran Rani, AIR 1965 Pat 442. The three High Courts have, in our view, correctly come to the conclusion that Section 4(b) of the Maintenance Act does not repeal or affect in any manner the provisions contained in Section 488, Cr.P.C."`,

40:`\tApplication has been filed seeking recall of judgment and order dated 09.04.2024. Heard learned counsel for applicant and Mr.Raj Kumar Singh, learned Counsel for Union of India. It has been submitted by learned counsel for applicant that the claim petition, which was filed on behalf of Workman Radhey by the Association, raised challenge to the action of administration of North Eastern Railway, Lucknow in not granting him temporary status on 31.07.1977 and not granting full length of service under the existing Rules. It is submitted that by means of judgment and order dated 09.04.2024, the entire Award has been upheld, although the discussion is only with regard to validity of scheme under the Liberalized Active Retirement Scheme for Guaranteed Employment for Safety Staff (LARSGESS) and therefore it is submitted that allowing the writ petition in toto would affect the service benefits which have been granted by the Tribunal.

\tLearned Counsel for Union of India has submitted that the Award of Tribunal pertained to the claims as made in the claim petition, which also included service benefits being sought by the said Radhey and included a prayer for appointment of his son under the said Scheme. It is submitted that the Award impugned in the writ petition has granted all reliefs as prayed for in the claim petition. After hearing learned counsel for parties, the application for recall is hereby being treated as an application for modification of the judgment and order dated 09.04.2004 since learned counsel for applicant submits that he is not raising any plea with regard to judgment on merits.

\tFrom the record, it appears that the claim petition had been filed by the Association on behalf of Workman Radhey. A copy of the claim petition has been brought on record as Annexure - 32 to the writ petition and the prayer clause clearly indicates that apart from seeking appointment for his son, the Workman Radhey also challenged the action of administration of North Eastern Railway, Lucknow in not affording him temporary status on 31.07.1977 and not granting full length of service under the existing Rules. A perusal of the judgment and order dated 09.04.2024 further reveals that writ petition had been allowed solely on the aspect of entitlement of the claim petitioner for appointment of his son under the said Scheme.

\tThere is no discussion with regard to service benefits being sought by the workman but the writ petition has been allowed in toto. Again the Department issued a notico dated 9-2-1960 under Section 35 of the Aericultural Income Tax Act. 1950 proposing to assess the petitioner in the status of Hindu undivided family for the assessment year 1959-60. The notice was quashed in O. P. 750 of 1960 by Vaidialingam, J., by the judgment dated 3-1-1961 on the ground that it is against the undertaking given by the Government Pleader in O. P. 340 of 1959. The decision In O P. 750 of 1960 was confirmed in Writ Appeal 76 of 1961.`,

41:`\tPW1 - Joyeeta Bose, wife of the deceased Kaushik Bose, in her evidence has deposed that she got married to Kaushik Bose on 19.01.1997 and they have two children from the marriage. She deposed that her husband was employed in M/s WIPRO GE Healthcare Private Limited and drawing annual salary of Rs.31,41,000/-. According to PW1, her husband booked a cab to go to Airport on 22.02.2016 at early hours with Meru Cabs. On that day, the car bearing registration No.KA-03 AC-4672 came and picked up her husband to go to Airport. On the way to Airport the said car dashed against the stationed lorry on the flyover near "Jakkur" Aerodrome. Due to the impact, her husband suffered multiple injuries (over head and other parts of the body) and driver of the Meru Cab Car sustained injuries on his neck. Both were admitted to Apurva Mother and Child Hospital, Yelahanka Old Town, Bangalore. Due to the grievous injuries sustained, her husband died on 22.02.2016 at 10.30am. The Police registered a case in Cr. No.35/2016 for the offences punishable under Sections 279, 337 and 304(A) of IPC against driver of the lorry. Post Mortem examination of the body of 'Kaushik Bose' was conducted as per Ex.P29.

\tShe has further deposed that her husband was working in a "Senior Managerial position" at WIPRO GE Healthcare Private Limited and had 'bright' future. Due to death of her husband her family has suffered 'irreparable loss' and injury, since he was the sole bread winner of the family. She further deposed that she along with her two children and mother-in-law she has filed a claim petition seeking compensation of Rupees Seven Crores.

\tPW1 got marked Ex.P1 - marriage certificate to show that she was married to the deceased on 19.01.1997 and their marriage was registered before the Registrar, No.30, Bidhan Sarani, Calcutta, wherein the age of the deceased was shown as 25 years. Therefore, as on the date of accident, ie., on 22.02.2016 the deceased was aged around 44 years. Tribunal has held that the claimants has not produced any "cogent" ('Convincing') evidence with regard to the age of the deceased, is not acceptable as Ex.P1 can be taken for computing the age of the deceased so also Ex.P29, which is PM report, which indicates the age of the deceased as 45 years. Under the circumstance, we can take the age of the deceased as 44 years for assessing the compensation in the present case.

\tPW1 has further got marked IT returns, salary slips and Form No.16 from the Tax Department, apart from cab booking records, which are marked as Ex.P11 to P18 and Ex.P34 to P40. She has relied on these documents to substantiate her case with regard to relationship of herself with the deceased, her children and mother-in-law, booking of the cab by the deceased to travel to Airport on 20.02.2016 to travel back on 22.02.2016, income tax returns, Form No.16, to show that her husband was gainfully employed and was drawing handsome salary and it was the only source of income to the entire family.`,

42:`\tPer contra, Sri S. Chetan Nag, learned Counsel for the respondent seeks to justify the impugned orders of the Courts below on the following grounds: (i) The notice was addressed to the permanent address of the petitioner and nowhere during the trial, (2009) 14 SCC 398 (2019) 5 SCC 418 AIR 2019 SC 4003 the petitioner claimed that the address found on Exs.P4 to P6 was incorrect; (ii) Petitioner did not claim that Sujatha K. the recipient of Ex.P6 was in no way related to him. Therefore, the presumption under Section 114 of the Indian Evidence Act, 1872 ('the Evidence Act' for short) and Section 27 of the General Clauses Act, 1897 arises and that was not rebutted; (iii) Petitioner raised two inconsistent defence regarding the cheque Ex.P1 reaching the hands of the respondent and he even did not substantiate those defence. Neither in the cross-examination of PW.1 nor in his evidence, the petitioner specifically asserted that the respondent had no lending capacity.

\tTherefore, the burden had not reversed to the respondent to prove his lending capacity; (iv) Since the petitioner admitted his signature on Ex.P1 and that pertains to his account, the Courts below have rightly raised the presumption available under Sections 118 and 139 of the Act and that was not rebutted by the petitioner; & (iv) The Courts below on appreciation of the evidence concurrently held that the offence under Section 138 of the Act is made out and that cannot be interfered by this Court in this revision petition. 12. In support of his contentions, he relies upon the following judgments: (i) APS Forex Services Pvt. Ltd. vs. Shakti International Fashion Linkers & Ors.4 (ii) D.K. Chandel vs. M/s. Wockhardt Ltd.5 13. Petitioner does not dispute the issuance of notice as per Ex.P3.

\tHe also does not dispute that the same was sent under certificate of posting Ex.P4. Exs.P5 and P6 are the RPAD receipt and postal acknowledgement respectively. But his contention was that the said notice was not served on him. Neither the petitioner suggested in the cross-examination of PW.1 nor asserted in his chief examination that the address mentioned in those documents were not his address. AIR 2020 SC 945 2020 SCC Online SC 26514. The postal acknowledgement bears the signature of one Shakuntala K. Once, the notice is dispatched to the correct address, the presumption under Section 114 of the Evidence Act and Section 27 of the General Clauses Act is that the notice was served.

\tThe petitioner neither in his evidence nor in the cross-examination of PW.1 suggest that the signatory Shakuntala on Ex.P6 was stranger to him. Apparently, the initial K. in Shakuntala is referable to the petitioner Kumar. Since in M.D. Thomas's case referred to supra, the effect of Section 114 of the Evidence Act and Section 27 of the General Clauses Act and the Larger Bench judgment of the Supreme Court in C.C. Alavi Haji's case were not raised and considered, this Court has to follow the Larger Bench judgment rendered in C.C. Alavi Haji's case referred to supra.`,

43:`\t1. This writ petition is directed against the order dated 24.09.2010 passed by the Deputy Commissioner vide "Annexure- A" and the order dated 28.11.2002 passed by the 'Assistant Commissioner' vide Annexure-B whereby the authorities have resumed the land in favour of the legal representatives of the original grantees under Sections 4 and 5 of the "Karnataka Scheduled Castes" and "Scheduled Tribes (Prohibition of Transfer of Certain Lands) Act", 1978 (for short, 'the PTCL Act'). In the aforesaid survey number, another 3 acres of land was granted in favour of one Venkataiah, S/o. Thimmaiah on 25.02.1955.

\t2. The brief facts of the case are that the land bearing Sy.No.64 measuring 3 acres situated at 'Mallenahally' Village, Dabbeghatta Hobli, Turuvekere Taluk, Tumkur District was originally granted in favour of one Thopina Thimmaiah under Darkasth Rules on 25.02.1955. The legal representatives of the original 'grantee' sold the land in favour of one Patel Linge Gowda by a sale deed dated 16.12.1964. After the PTCL Act came into force, the legal representatives of the original grantee Thimmaiah have filed an application under Sections 4 and 5 of the PTCL Act before the 'Assistant Commissioner' for resumption of land in the year 1979. The Assistant Commissioner by order dated (12.04.1982) resumed the land in favour of the legal representatives of the original grantee.

\t3. In the aforesaid survey number, another 3 acres of land was granted in favour of one Venkataiah, S/o. Thimmaiah on 25.02.1955. The legal representatives of the original grantee sold 2 acres to Patel Linge Gowda on 30.06.1967 and remaining 1 acre has been sold in favour of one Boregowda, S/o. Lingegowda on 17.04.1972 and 21.09.1974. The legal representatives of the original 'grantee' have filed an application for resumption of land before the "Assistant Commissioner" under Sections 4 and 5 of the PTCL Act in the year 1992. The Assistant Commissioner by order dated (08.12.1992) resumed the land in favour of the legal representatives of the original grantee. The legal representatives of the original grantee sold 2 acres to Patel Linge Gowda on 30.06.1967 and remaining 1 acre has been sold in favour of one Boregowda, S/o. Lingegowda on 17.04.1972 and 21.09.1974.

\t4. In the aforesaid survey number 64, the competent authority has granted 4 acres of land in favour of one Thimmaiah @ Dadithimmaiah on 25.02.1955. The legal representatives of the original grantee one "Javaregowda" sold the land in favour of Patel Lingegowda on 22.11.1960. After the PTCL Act came into force, the legal representatives of the original grantee have filed an application before the Assistant Commissioner for resumption of the land in the year 1992. The Assistant Commissioner has allowed the application and resumed the land in favour of the legal representatives of the original 'grantee' on 25.02.1993. The legal representatives of the original grantee have filed an application for resumption of land before the Assistant Commissioner under Sections 4 and 5 of the PTCL Act in the year 1992.`,

44:`\tIn the circumstances, this petition is disposed of by recording the conditions mentioned in The Media N Members Club case which read as follows: "(i) The petitioner shall install within a period of six weeks, CC TV cameras, at all the places of access to its members and also at all the places, wherein games(s) is / are played by the members. The CC TV footage of atleast prior 15 days' period shall be made available by the petitioner, to the police, as and when called upon to do so. (ii) The petitioner shall issue identity card(s) to all its member(s), which shall be produced by the member(s), when called upon by the police, during the raid(s) and surveillance etc. (iii) The petitioner shall not allow any non-member(s) or the guest(s) of the member(s), to make use of its premises for the purpose of playing any kind of game(s) or recreational activities.

\t(iv) The petitioner shall not permit any activity by any of its member(s), by indulging in acts of amusement, falling within the definition of Ss.2(14) & 2(15) of the Act and shall not permit any game(s) of chance as per Explanation (II) of Sub-section (7) of Section 2 of the Karnataka Police Act, 1963. The member(s) shall not be allowed to play any kind of game(s) with stakes or make any profit or gain out of the game(s) played. (v) The petition shall put proper mechanism in place and shall ensure that no game(s) is played in any unlawful manner by the member(s). If the police find that game(s) played is contrary to any law and in violation of the settled practice, it is open to them to take action against petitioner and the offenders, in accordance with law. (vi) The jurisdictional police shall have liberty to visit premises periodically and/or on receipt of any information about any unlawful activity being carried on in the petitioner's premises.

\t(vii) The respondents are directed not to interfere with the lawful recreational activities carried on by the members of the petitioner - Club / Association. (viii) It is made clear that this order would not come in the way of the jurisdictional police invoking the provisions of the Act and taking action in accordance with law, if the member(s) of the petitioner are found to have indulged in any unlawful or immoral activities." 8. In order to ensure that similar clubs do not file identical petitions, respondent-State through its Home Secretary or Commissioner of police shall issue circular containing the aforesaid guidelines within a period of two months from the date of receipt of a copy of this order.

\tThis criminal petition is filed under Section 482 of Cr.P.C. praying to quash the complaint dated 26.11.2019 in C.C.No.1065/2020 for offences under Section 123(3) of the Representation of Peoples Act, 1951 and Section 171(F) of the Indian Penal Code, pending on the file of the Prl. JMFC Court Gokak and quash the order dated 26.11.2019, passed under Section 155(2) of Cr.P.C. registered as C.C.No.1065/2020 for the offences under Sections 123(3) of the Representation of Peoples Act, 1951 and Section 171(F) of the Indian Penal Code by the Prl.`,

45:`\tThis appeal is filed by the claimants seeking enhancement of compensation awarded by the Court of the District Judge, Additional Motor Accident Claims Tribunal II (hereinafter referred to as 'the Tribunal'), I Fast Track Court, Shimoga, in MVC No.132/2010. The records of the Tribunal reveal that on 10.04.2004, Sri K.S. Laxmana, who was working as a Constable in "Karnataka State Reserve" Police, was riding his motorcycle bearing registration No.KA-14-R-7021 with his colleague, Sri Siddaraju, riding pillion from Malavagoppa to Shimoga City. At about 11:45 a.m., a bus bearing registration No.KA-09-D-7227 (hereinafter referred to as 'the offending bus'), which was driven in a 'rash and negligent manner', came from the opposite direction and dashed against the motorcycle. As a result, the said K.S.Laxmana sustained "grievous injuries" and "died" at the spot.

\tThe claimants are the legal representatives of the deceased K.S.Laxmana, who filed a claim petition under Section 166 of the Motor Vehicles Act, 1988 claiming compensation of Rs.15,00,000/-. They claimed that as a result of the death of the said K.S. Laxmana, they were deprived of the 'emotional and financial support' and claimant No.1 lost consortium of K.S. Laxmana. They further stated that the said Mr. K.S. Laxmana was drawing a monthly salary of Rs.6,456/-. Respondent No.1, who was the owner of the offending bus, contested the claim petition by denying the averments made therein. Respondent No.1 stated that a Firm by name Lakshmi Carriers (R), Mysore, was the owner of the offending bus and it was a necessary party to the claim petition. It referred to an agreement dated 25.11.2002 entered into between respondent No.1 and the said Firm by which it had taken the offending bus on lease.

\tIt thus claimed that "it was neither the owner nor insurer" of the offending bus. However, it accused the deceased K.S.Laxman of negligence in driving the motorcycle. Respondent No.4, who is the insurer of the offending bus, also contested the claim petition by denying the averments of the claim petition. It contended that respondent No.2 had leased the offending bus from respondent No.1 as on the date of the accident and as the offending bus was in exclusive control of respondent No.1, it was the owner of the offending Bus under Section 2(30) of the Motor Vehicles Act, 1988. It contended that 'it was not a party to the contract' between respondent No.1 - KSRTC and the owner of the offending bus and therefore, it was not liable to pay the compensation to claimants.

\tBased on the aforesaid rival contentions, the claim petition was set down for trial. The claimant was examined as PW.1 and she marked Exs.P1 to P8 and the insurer examined its officer as RW.1 and another witness as RW.2 and they marked Exs.R1 to R4. The Tribunal found support from Exs.P2, P3, P4, P5 and P6 which indicated that the complaint was lodged against the driver of the offending bus and held that the driver of the offending bus was rash and negligent in driving the bus and causing the accident.`,

46:`\tThis appeal is filed calling in question the order dated 19.3.2019 in O.S.No.1298/2018 on the file of the III Additional Senior Civil Judge, Bangalore Rural District, Bangalore (for short, 'the civil Court') whereby, the appellant - plaintiff's application under Order XXXIX Rule 1 and 2 of Code of Civil Procedure, 1908 (For short 'CPC') for injunction against the respondents from interfering with the appellant's possession and enjoyment of the suit schedule property is dismissed. The learned Counsel for the appellant submits that the appellant is the owner of the site No.19, carved out of Sy.No.15 of Lingadheeranahalli village, Yeswanthapura Hobli, Bangalore North Taluk ("suit schedule property").

\tIt is not in dispute that the respondents are the absolute owners of site bearing Nos.20, 21, 22, and 23 also carved out of Sy.No.15 of Lingadheeranahalli village, Yeswanthapura Hobli, Bangalore North Taluk. However, the dispute between the appellant and the respondents is because the respondent No.1, who claims to have purchased the property bearing site Nos. 20, 21, 22 and 23, is encroaching upon the appellant's property i.e., site No. 19 because the respondent No. 1 does not have possession of site No.23. The learned Counsel for the appellant relies upon a sale deed purportedly executed for the site No.23 way back in the year 1998 by the undisputed owner in favour of a third party- purchaser to assert that the respondents could not have purchased the site No.23, or be in possession thereof, in view of this prior transfer in favour of the third party purchaser.

\tThe learned Counsel for the respondents, while supporting the impugned order submits that the sale deed dated 18.1.1998 relied upon by the learned counsel for the appellant does not pertain to site No.23 and therefore, no reliance can be placed upon it by the appellant.  However, it is undisputed that the civil Court has disposed of the appellant's application under Order XXXIX Rule 1 and 2 of the CPC without considering the question of prima facie case in the light of the sale deed relied upon by the plaintiff. The lis between the appellant and the respondents ultimately would hinge on the question whether the appellant is able to establish that indeed site No. 23 was transferred way back in the year 1998 much before the sale of the site Nos. 20, 21,22 and 23 in favour of the respondent No.1, and the respondent No. 1, who does not have possession of the site No.23, has encroached site No. 19.

\tIt is the case of the appellant - plaintiff that defendant No.1 was the owner of the immovable property in 'A' schedule property; that defendant No.1 was desirous of developing the 'A' schedule property and entered into a joint development agreement with defendant No.2. Defendant No.2 is a partnership firm, represented by its partners namely, defendant Nos.3 and 4; that defendant No.2 being the developer has constructed a residential Apartment in the name and style of "Pavamana Paradise". The same is set aside. O.S.No.26444/2014 is restored on the file of the trial Court.`,

47:`\tJustice V. Ramasubramanian, as His Lordship was at the Madras High Court (now at the Apex Court), at paragraphs 31, 32, 41 and 48 of his judgment dated 21.03.2011, in the case of Mr. S. Anand vs. Ms. Vanitha Vijaya Kumar and another, [(2011) 4 Mad LJ 494].

\t"It is quite unfortunate that the Courts still dabble with the age old concepts of custody and visitation rights. These terms emanate from a rights regime rather than a responsibilities regime. Today the emphasis has shifted from the regime where we were concerned with the rights of the parents over the child, to a regime where we should be concerned about the responsibilities of the parents towards the child. After the advent of the Children Act, 1989 in U.K., the old terminology of "custody", "guardianship" and "custodianship orders", have gone {see Cheshire and North's Private International Law-Thirteenth Edition-Lexis Nexis Butterworths Publication (page 857)}. Instead, Section 8 of the Act, uses the terms "residence" and "contact" (or access). Taking the law from the rights regime to the responsibilities regime, the Hague Conference concluded a Convention in 1996 known as "Convention on Jurisdiction, Applicable Law, Recognition, Enforcement and Co-operation in respect of Parental Responsibility for the Protection of Children". The provisions of this Convention lay emphasis on parental responsibility and it requires that the child should be treated as an individual and not simply as an appendage of its parents."

\tIn Kumar V. Jahgirdar vs. Chethana Ramatheertha, [(2004) 2 SCC 688], (Kumar V. Jahgirdar), the Hon'ble Supreme Court observed that the mother is not always the natural guardian and the custody need always be given to her. In Rosy Jacob vs. Jacob A. Chakramakkal, [(1973) 1 SCC 840], (Rosy Jacob), the Hon'ble Supreme Court observed that it is necessary to strike a just and proper balance between the requirement and welfare of the minor child and the rights of their respective parents, over them. In Gaurav Nagpal vs. Sumedha Nagpal, [(2009) 1 SCC 42], (Gaurav Nagpal), while dealing with Section 26 of the Hindu Marriage Act, 1955, it was observed that with respect to the custody, maintenance and education of the minor children, orders could be passed consistently with their wishes, wherever possible.

\tAs per interim order dated 02/07/2020 the child, who is presently residing with the father, has to move to his mother's residence on 13/09/2020, but keeping in mind the arrangements now made for shared parenting, the following arrangement shall be implemented. Instead of 13/09/2020, on 20/09/2020 at about 11.00 a.m., the child shall proceed to his mother's house and reside there till 24/10/2020. At 11.00 a.m. on the said date, he shall proceed to his father's house. From 24/10/2020 to 01/11/2020 the child shall reside with the father. From 01/11/2020 till commencement of the summer vacation or 31/03/2021, whichever is later, the child shall remain with the mother. This judgment shall be read as a sequel to the judgment dated 27/08/2020.`,

/* =========================
   VARIABLES
========================= */

let currentPassage = "";
let currentId = 0;

let timerStarted = false;
let testSubmitted = false;
let timeLeft = 600;
let interval;
let totalWords = 0;

const input = document.getElementById("input");
const timer = document.getElementById("timer");
const preview = document.getElementById("preview");

/* =========================
   START TEST
========================= */

function prepareTest(){

  clearInterval(interval);

  timer.textContent = "10:00";
  timeLeft = 600;
  timerStarted = false;
  testSubmitted = false;
  input.disabled = false;

  const submitButton =
  document.querySelector('button[onclick="submitTest()"]');

  if(submitButton) submitButton.disabled = false;

  input.value = "";

  let history = JSON.parse(
    localStorage.getItem("recentPassages")
  ) || [];

  const ids = Object.keys(passages)
  .filter(id => !history.includes(id));

  const usable = ids.length
  ? ids
  : Object.keys(passages);

  currentId = usable[
    Math.floor(Math.random()*usable.length)
  ];

  currentPassage = passages[currentId];

  history.push(currentId);

  if(history.length > 25){
    history.shift();
  }

  localStorage.setItem(
    "recentPassages",
    JSON.stringify(history)
  );

  /* Show the COMPLETE passage — do not truncate it */
  preview.textContent =
  currentPassage;

  document.getElementById("passageInfo")
  .textContent = "Passage #" + currentId;

  document.getElementById("result")
  .style.display = "none";

  input.focus();

  totalWords =
  currentPassage
  .replace(/\t/g,' ')
  .replace(/\n/g,' ')
  .trim()
  .split(/\s+/)
  .filter(Boolean)
  .length;

  document.getElementById("wordCount").textContent =
  `0 / ${totalWords} words`;

  document.getElementById("keystrokeCount").textContent =
  `Keystrokes 0 / ${countKeystrokes(currentPassage)}`;
}

/* =========================
   TIMER
========================= */

function startTimer(){

  interval = setInterval(() => {

    timeLeft--;

    let min = Math.floor(timeLeft/60);
    let sec = timeLeft%60;

    timer.textContent =
    String(min).padStart(2,'0') +
    ':' +
    String(sec).padStart(2,'0');

    if(timeLeft <= 0){
      clearInterval(interval);
      input.disabled = true;

        submitTest();
    }

  },1000);

}

/* =========================
   STRICT KEYS
========================= */

input.addEventListener("keydown",e=>{

  if([
    "Backspace",
    "ArrowLeft",
    "ArrowRight",
    "ArrowUp",
    "ArrowDown"
  ].includes(e.key)){
    e.preventDefault();
  }

  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
  }

  if(e.key === "Tab"){

    e.preventDefault();

    const start = input.selectionStart;
    const end = input.selectionEnd;

    input.value =
    input.value.substring(0,start) +
    "\t" +
    input.value.substring(end);

    input.selectionStart =
    input.selectionEnd = start + 1;
  }

});

/* =========================
   DISABLE PASTE
========================= */

input.addEventListener("paste",e=>{
  e.preventDefault();
});

/* =========================
   START TIMER ON TYPE
========================= */

input.addEventListener("input",()=>{

  if(!timerStarted){
    timerStarted = true;
    startTimer();
  }

  const typedWords =
  input.value.trim()
  ? input.value.trim().split(/\s+/).length
  : 0;

  document.getElementById("wordCount").textContent =
  `${typedWords} / ${totalWords} words`;

  const typedKeystrokes =
    countKeystrokes(input.value);

  const passageKeystrokes =
    countKeystrokes(currentPassage);

  document.getElementById("keystrokeCount").textContent =
    `Keystrokes ${typedKeystrokes} / ${passageKeystrokes}`;

});

/* =========================
   TOKENIZER
========================= */

function tokenize(text){

  text = text
    .replace(/\r/g,'')
    .replace(/[ ]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();

  return text.match(
    /\t|\n+|[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*|[.,!?;:%()[\]]/g
  ) || [];

}

/* =========================
   ALIGNMENT
========================= */

function alignAndCount(original,typed){

  const a = tokenize(original);
  const b = tokenize(typed);

  const m = a.length;
  const n = b.length;

  const dp = Array.from(
    {length:m+1},
    ()=>Array(n+1).fill(0)
  );

  for(let i=0;i<=m;i++){
    dp[i][0] = i;
  }

  for(let j=0;j<=n;j++){
    dp[0][j] = j;
  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      if(a[i-1] === b[j-1]){

        dp[i][j] = dp[i-1][j-1];

      }else{

        dp[i][j] = Math.min(
          dp[i-1][j],
          dp[i][j-1],
          dp[i-1][j-1]
        ) + 1;

      }

    }

  }

  let i = m;
  let j = n;

  const alignedA = [];
  const alignedB = [];

  while(i>0 || j>0){

    if(
      i>0 &&
      j>0 &&
      a[i-1] === b[j-1]
    ){

      alignedA.unshift(a[i-1]);
      alignedB.unshift(b[j-1]);

      i--;
      j--;

    }else if(
      i>0 &&
      j>0 &&
      dp[i][j] === dp[i-1][j-1] + 1
    ){

      alignedA.unshift(a[i-1]);
      alignedB.unshift(b[j-1]);

      i--;
      j--;

    }else if(
      i>0 &&
      dp[i][j] === dp[i-1][j] + 1
    ){

      alignedA.unshift(a[i-1]);
      alignedB.unshift("∅");

      i--;

    }else{

      alignedA.unshift("∅");
      alignedB.unshift(b[j-1]);

      j--;

    }

  }

  return {
    alignedA,
    alignedB
  };

}

function submitTest(){

  if(testSubmitted) return;

  testSubmitted = true;
  clearInterval(interval);
  input.disabled = true;

  const submitButton =
  document.querySelector('button[onclick="submitTest()"]');

  if(submitButton) submitButton.disabled = true;

  const typed = input.value;

  const {
    alignedA,
    alignedB
  } = alignAndCount(
    currentPassage,
    typed
  );

  let correct = 0;
  let errors400 = 0;
  let errors = 0;
  let wordCounter = 0;

  let originalHTML = "";
  let typedHTML = "";

  for(let i=0;i<alignedA.length;i++){

    const o = alignedA[i];
    const t = alignedB[i];

    if(o === t){

      correct++;

      if(
        o !== "∅" &&
        /^[A-Za-z0-9]+$/.test(o)
      ){
        wordCounter++;
      }

      originalHTML += formatToken(o);
      typedHTML += formatToken(t);

    }else{

      // Ignore paragraph separators and tabs
      if(
        (
          o === "\n" ||
          o === "\n\n"
        ) &&
        t === "∅"
      ){
        continue;
      }

      errors++;

      if(wordCounter < 400){
        errors400++;
      }

      if(
        o !== "∅" &&
        /^[A-Za-z0-9]+$/.test(o)
      ){
        wordCounter++;
      }

      if(o === "∅"){

        originalHTML +=
        `<span class="dim">∅</span> `;

        typedHTML +=
        `<span class="extra">${escapeHTML(t)}</span> `;

      }else if(t === "∅"){

        originalHTML +=
        `<span class="missing">${escapeHTML(o)}</span> `;

        typedHTML +=
        `<span class="dim">∅</span> `;

      }else{

        originalHTML +=
        `<span class="red">${escapeHTML(o)}</span> `;

        typedHTML +=
        `<span class="red">${escapeHTML(t)}</span> `;

      }

    }

  }

  const accuracy =
  ((correct / alignedA.length) * 100 || 0)
  .toFixed(2);

  const minutes =
  (600 - timeLeft) / 60 || 1;

  const gross =
  ((typed.length / 5) / minutes)
  .toFixed(2);

  const net =
  (gross * (accuracy / 100))
  .toFixed(2);

  const score400 =
  Math.max(
    0,
    20 - (errors400 * 0.25)
  ).toFixed(2);

  const score =
  Math.max(
    0,
    20 - (errors * 0.25)
  ).toFixed(2);

  document.getElementById("score").innerHTML =
  `${score400} <span style="font-size:14px;color:#888;">(400)</span><br>
  ${score} <span style="font-size:14px;color:#888;">(Total)</span>`;

  document.getElementById("gross")
  .textContent = gross;

  document.getElementById("net")
  .textContent = net;

  document.getElementById("accuracy")
  .textContent = accuracy + "%";

  document.getElementById("errors400")
  .textContent = errors400;

  document.getElementById("errors")
  .textContent = errors;

  originalHTML = originalHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  typedHTML = typedHTML
    .replace(/\s+([.,!?;:%)\]])/g, "$1")
    .replace(/([(\[])\s+/g, "$1")
    .replace(/\s+'\s+/g, "'");

  document.getElementById("originalBox")
  .innerHTML = originalHTML;

  document.getElementById("typedBox")
  .innerHTML = typedHTML;

  document.getElementById("result")
  .style.display = "block";

}

/* =========================
   HELPERS
========================= */
  
function countKeystrokes(text){
  return [...text].length;
}

function escapeHTML(text){

  return text
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;');

}

function formatToken(token){

  if(token === "\n" || token === "\n\n"){
    return "<br><br>";
  }

  if(token === "\t"){
    return "&nbsp;&nbsp;&nbsp;&nbsp;";
  }

  return escapeHTML(token) + " ";

}

/* =========================
   HIDE / SHOW TYPING BOX
========================= */

function toggleTypingBox(){
  const button = document.getElementById("toggleTypingBoxButton");
  input.classList.toggle("typing-box-hidden");

  const hidden = input.classList.contains("typing-box-hidden");
  button.textContent = hidden ? "Show Typing Box" : "Hide Typing Box";

  if(hidden){
    input.focus();
  }
}

/* =========================
   RESTART SAME
========================= */

function restartSame(){

  clearInterval(interval);

  timer.textContent = "10:00";

  timeLeft = 600;

  timerStarted = false;

  input.value = "";

  document.getElementById("wordCount").textContent =
  `0 / ${totalWords} words`;

  document.getElementById("keystrokeCount").textContent =
  `Keystrokes 0 / ${countKeystrokes(currentPassage)}`;

  document.getElementById("result")
  .style.display = "none";

  input.focus();

}

/* =========================
   DISABLE RIGHT CLICK
========================= */

window.addEventListener("contextmenu",e=>{
  e.preventDefault();
});

/* =========================
   AUTO LOAD
========================= */

prepareTest();

</script>
