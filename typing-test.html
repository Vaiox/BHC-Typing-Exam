<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHC Typing Test</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080808;
  color:#f0f0f0;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:20px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#121212;

  border:1px solid #1f1f1f;

  padding:16px 20px;

  border-radius:16px;

  margin-bottom:18px;

  box-shadow:
  0 8px 30px rgba(0,0,0,0.4);
}

.top-left{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  align-items:center;
}

.timer{
  font-size:24px;
  font-weight:700;
  color:#00ffae;
}

.info{
  color:#888;
  font-size:14px;
}

/* =========================
   PREVIEW
========================= */

.preview{
  background:#101010;

  border:1px solid #1b1b1b;

  border-radius:14px;

  padding:15px 18px;

  color:#777;

  line-height:1.7;

  margin-bottom:15px;

  min-height:70px;
}

/* =========================
   TEXTAREA
========================= */

textarea{
  width:100%;
  height:1000px;

  background:#0f0f0f;

  border:1px solid #1f1f1f;

  border-radius:16px;

  padding:24px;

  color:#f1f1f1;

  font-size:16px;

  line-height:1.9;

  resize:none;

  outline:none;

  transition:0.25s;

  caret-color:#00ffae;
}

textarea:focus{
  border-color:#00ffae;

  box-shadow:
  0 0 0 3px rgba(0,255,174,0.08);
}

/* =========================
   BUTTONS
========================= */

.buttons{
  margin-top:18px;

  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

button{
  border:none;

  padding:12px 22px;

  border-radius:12px;

  background:
  linear-gradient(
  135deg,
  #00ffae,
  #00cfff
  );

  color:#000;

  font-weight:700;

  font-size:15px;

  cursor:pointer;

  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);

  box-shadow:
  0 8px 20px rgba(0,255,174,0.2);
}

/* =========================
   RESULT PANEL
========================= */

.result{
  display:none;

  margin-top:25px;

  background:#111111;

  border:1px solid #1c1c1c;

  border-radius:16px;

  padding:24px;
}

.stats{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(180px,1fr));

  gap:15px;

  margin-bottom:24px;
}

.card{
  background:#171717;

  border:1px solid #232323;

  border-radius:14px;

  padding:18px;

  text-align:center;
}

.card h3{
  font-size:14px;
  color:#888;
  margin-bottom:10px;
  font-weight:500;
}

.card p{
  font-size:28px;
  font-weight:700;
  color:#00ffae;
}

/* =========================
   COMPARISON
========================= */

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.box{
  background:#181818;

  border:1px solid #252525;

  border-radius:14px;

  padding:18px;

  line-height:1.9;

  white-space:pre-wrap;

  overflow-wrap:break-word;
}

/* =========================
   ERROR COLORS
========================= */

.red{
  color:#ff5252;
}

.missing{
  background:#ff9800;
  color:#000;
  padding:2px 4px;
  border-radius:4px;
}

.extra{
  background:#ffe600;
  color:#000;
  padding:2px 4px;
  border-radius:4px;
}

.dim{
  opacity:0.35;
}

/* =========================
   WORD-STYLE DOCUMENT WORKSPACE
   Continuous scrolling; no pagination
========================= */

:root{
  --paper-bg:#ffffff;
  --paper-text:#202020;
  --paper-edge:#d1d5db;
  --ruler-bg:#f1f2f4;
  --ruler-line:#858b93;
  --paper-font:Arial,sans-serif;
  --paper-font-size:16px;
  --paper-line-height:1.65;
  --paper-padding-x:64px;
  --paper-padding-y:54px;
}

.typing-area{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:22px;
  align-items:start;
  margin-bottom:16px;
}

.paper-column{
  min-width:0;
}

.paper-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:0 0 9px;
  padding:0 2px;
  color:#e8e8e8;
  font-size:14px;
  font-weight:700;
}

.paper-heading span{
  color:#00ffae;
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
}

/* Gray Word-like workspace around the white document */
.paper-workspace{
  position:relative;
  display:grid;
  grid-template-columns:27px minmax(0,1fr);
  grid-template-rows:25px minmax(0,1fr);
  height:800px;
  min-height:400px;
  overflow:hidden;
  background:#dfe1e5;
  border:1px solid #b9bdc4;
  border-radius:3px;
  box-shadow:0 7px 24px rgba(0,0,0,.28);
}

.ruler-corner{
  grid-column:1;
  grid-row:1;
  background:#e7e8eb;
  border-right:1px solid #c6c9cf;
  border-bottom:1px solid #c6c9cf;
}

.horizontal-ruler{
  grid-column:2;
  grid-row:1;
  position:relative;
  overflow:hidden;
  background-color:var(--ruler-bg);
  border-bottom:1px solid #c6c9cf;
  background-image:repeating-linear-gradient(to right,transparent 0,transparent 23px,#a3a8af 23px,#a3a8af 24px,transparent 24px,transparent 95px,#858b93 95px,#858b93 96px);
}

.horizontal-ruler::before{
  content:"0          1          2          3          4          5          6          7          8";
  position:absolute;
  inset:1px 0 auto 5px;
  white-space:pre;
  color:#555b63;
  font:9px/11px Arial,sans-serif;
  letter-spacing:5px;
  pointer-events:none;
}

.vertical-ruler{
  grid-column:1;
  grid-row:2;
  position:relative;
  overflow:hidden;
  background-color:var(--ruler-bg);
  border-right:1px solid #c6c9cf;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,#a3a8af 23px,#a3a8af 24px,transparent 24px,transparent 95px,#858b93 95px,#858b93 96px);
}

.vertical-ruler::before{
  content:"1\A\A\A\A2\A\A\A\A3\A\A\A\A4\A\A\A\A5\A\A\A\A6\A\A\A\A7\A\A\A\A8";
  position:absolute;
  top:3px;
  left:5px;
  white-space:pre;
  color:#555b63;
  font:9px/24px Arial,sans-serif;
  pointer-events:none;
}

/* Both document surfaces share the same typography and margins. */
.typing-area .preview,
.typing-area textarea{
  grid-column:2;
  grid-row:2;
  display:block;
  width:100%;
  min-width:0;
  height:100%;
  min-height:0;
  margin:0;
  border:0;
  border-radius:0;
  padding:var(--paper-padding-y) var(--paper-padding-x);
  background:var(--paper-bg);
  color:var(--paper-text);
  font-family:var(--paper-font);
  font-size:var(--paper-font-size);
  font-weight:400;
  line-height:var(--paper-line-height);
  letter-spacing:normal;
  text-align:left;
  white-space:pre-wrap;
  overflow-wrap:break-word;
  word-break:normal;
  tab-size:4;
  -moz-tab-size:4;
  box-shadow:none;
  scrollbar-width:thin;
  scrollbar-color:#aeb3ba #f3f3f3;
}

.typing-area .preview{
  overflow:auto;
  color:var(--paper-text);
  overflow-x:hidden;
}

.typing-area textarea{
  resize:none;
  outline:none;
  overflow:auto;
  caret-color:#1677d2;
  transition:box-shadow .15s ease;
}

.typing-area textarea:focus{
  box-shadow:inset 0 0 0 2px rgba(22,119,210,.22);
}

.typing-area textarea::placeholder{
  color:#777;
  opacity:1;
}

.typing-area .preview::-webkit-scrollbar,
.typing-area textarea::-webkit-scrollbar{
  width:10px;
}

.typing-area .preview::-webkit-scrollbar-track,
.typing-area textarea::-webkit-scrollbar-track{
  background:#f3f3f3;
}

.typing-area .preview::-webkit-scrollbar-thumb,
.typing-area textarea::-webkit-scrollbar-thumb{
  background:#b8bdc4;
  border:2px solid #f3f3f3;
  border-radius:8px;
}

.typing-area .preview::-webkit-scrollbar-thumb:hover,
.typing-area textarea::-webkit-scrollbar-thumb:hover{
  background:#9299a2;
}

/* Preserve the existing hide-box class if used by the test UI. */
.typing-area textarea.typing-box-hidden{
  opacity:0 !important;
}

.wordCount{
  margin-top:12px;
  text-align:center;
  color:#00ffa6;
  font-size:18px;
  font-weight:600;
}

@media(max-width:900px){
  .typing-area{
    grid-template-columns:minmax(0,1fr);
    gap:20px;
  }

  .paper-workspace{
    height:620px;
  }

  :root{
    --paper-padding-x:34px;
    --paper-padding-y:36px;
    --paper-font-size:15px;
    --paper-line-height:1.6;
  }

  .compare{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }
}

@media(max-width:480px){
  .container{
    padding:12px;
  }

  .paper-workspace{
    grid-template-columns:21px minmax(0,1fr);
    grid-template-rows:22px minmax(0,1fr);
    height:540px;
  }

  .horizontal-ruler::before{
    letter-spacing:2px;
  }

  :root{
    --paper-padding-x:22px;
    --paper-padding-y:28px;
    --paper-font-size:14px;
    --paper-line-height:1.6;
  }

  .paper-heading{
    font-size:13px;
  }
}


/* =========================
   STICKY TEST CONTROLS
========================= */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
}

.buttons{
  position:sticky;
  top:70px;
  z-index:99;
}

</style>
</head>
<body>

<div class="container">

  <div class="topbar">

    <div class="top-left">
      <div class="timer" id="timer">10:00</div>

      <div class="info">
        Strict Mode Enabled
      </div>
    </div>

    <div class="info" id="passageInfo">
      Passage #1
    </div>

  </div>

  <div class="typing-area">

    <section class="paper-column">
      <div class="paper-heading">
        <span style="color:inherit;letter-spacing:normal;text-transform:none;font-size:14px;">Original Passage</span>
        <span>READ ONLY</span>

      <div class="paper-workspace">
        <div class="ruler-corner" aria-hidden="true"></div>

    <section class="paper-column">

        <span style="color:inherit;letter-spacing:normal;text-transform:none;font-size:14px;">Your Typing</span>

      <div class="paper-workspace">
        <div class="ruler-corner" aria-hidden="true"></div>
        <div class="horizontal-ruler" aria-hidden="true"></div>

        <textarea
          id="input"
          spellcheck="false"

          autocorrect="off"
          autocapitalize="off"
          placeholder="Start typing here..."
        ></textarea>
      </div>
    </section>

  </div>

  <div class="buttons">
    <button onclick="prepareTest()">Start Test</button>

    <button onclick="restartSame()">
      Restart Same Passage
    </button>

    <button onclick="submitTest()">Submit</button>

    <button id="toggleTypingBoxButton" onclick="toggleTypingBox()">
      Hide Typing Box
    </button>
  </div>

  <div id="wordCount" class="wordCount">
  0 / 0 words
  </div>

  <div id="keystrokeCount" class="wordCount">
  Keystrokes 0 / 0
  </div>

  <div class="result" id="result">

    <div class="stats">

      <div class="card">
        <h3>Gross WPM</h3>
        <p id="gross">0</p>
      </div>

      <div class="card">
        <h3>Net WPM</h3>
        <p id="net">0</p>
      </div>

      <div class="card">
        <h3>Accuracy</h3>
        <p id="accuracy">0%</p>
      </div>

      <div class="card">
      <h3>Errors (400 Words)</h3>
      <p id="errors400">0</p>
      </div>

      <div class="card">
        <h3>Errors</h3>
        <p id="errors">0</p>
      </div>

      <div class="card">
        <h3>Score</h3>
        <p id="score">0</p>
      </div>

    </div>

    <div class="compare">

      <div class="box">
        <h3>Original Passage</h3>
        <br>
        <div id="originalBox"></div>
      </div>

      <div class="box">
        <h3>Your Typing</h3>
        <br>
        <div id="typedBox"></div>
      </div>

    </div>

  </div>

</div>

<script>

/* =========================
   PASSAGES
========================= */

const passages = {

1:`\tThis section incorporates quotations from Narada and Vasishta and produces categories of persons, who, in a Court of Law nowadays would not be held disqualified from inheritance. They are brought under the text of Yajnavalkya who adds the Sanskrit word " Adya" translated by Colebrooke as "as well as others; "its literal meaning being " and the like " or practically, " etc., etc." Under cover of the latitude afforded by this expression placitum 3 brings in such intangible persons as " an enemy to his father " and " one who is addicted to vice "--disqualifications so vague, it is clear, that no Court of Law could now assert their validity.

\tI do not think it right to say that these grounds of exclusion are obsolete or that they were originally intended to be moral rather than legal obligations : but rather that they are of so nebulous a character that they could never have been enforcible at any time when the enunciation of the rights of inheritance passed from the hands of family mediators or village panchayatdars to anything which can be dignified by the name of " Court of Law." 22. I do not think that any useful purpose would be served by inquiring into the meaning of such terms as " Mrindriya " or " Pangu."

\tThey do not seem to me to assist the present discussion and I think it is probable that legislation will abolish the exclusion from inheritance based on these terms before the Courts are called upon to determine their exact meaning. Similarly I think it unnecessary to discus whether Yajnavalkya meant anything more by using the word " Andha " than what Manu meant by '' Jathyandha ". " Jati " comes from the same root as the Greek Gignomai, Genes, etc., and Latin " Genus." It is, I think, clear that both Manu and the Mitakshara explicitly lay down the rule of law that at least a " Jathyandha " is excluded from inheritance and that the only way to escape from this is to do what SADASIVA AYYAR, J., has done and say boldly It is not a subsisting rule of law.

\tIt has become obsolete and abrogated. It is apparent that the author treats the mandate which he quotes as a mere moral maxim, opposed to the rule of law which he considers to be established by his text and if the expression " grandfather's estate " means no more than " ancestral estate," the text of Visvarupa need mean no more than that of the Mitakshara, and the right may be a mere right to maintenance or at most a capacity to transmit heritable blood. With regard to the Sarasvati Vilasa, the first observation to be made is that made by the learned Chief Justice in the course of the argument that, if the author wished to say that the text of the Mitakshara on this point was obsolete, he could perfectly well have said so in terms. Further in any levent the true explanation of the passage in the Sarasvati Vilasa is to my mind undoubtedly that given by TURNER, C.J., in Krishna v. Sami (1886) I.L.R,, 9 Mad., 64 (F.B.).`,
  
2:`\tMohammedan Law, being the personal law, possesses its own legal principles and regulations which govern family relationships in matters such as marriage, divorce, inheritance, custody and guardianship. Its distinctive feature sets it apart from other personal laws on fundamental issues. It is pertinent to examine the legal principles, if any, governing partition under Mohammedan law. Tahir Mahmood, in his book, 'The Muslim Law of India', 2nd Edition, Chapter 12 (Law of Inheritance) Paragraph II, has provided for various concepts related to succession in Muslim Law which distinguish it from other personal laws: "II. Muslim Law-Concepts known and unknown: 1. The Muslim law of succession is basically different from the parallel indigenous systems of India.

\tThe doctrine of janmswatvavada (right by birth), which constitutes the foundation of the Mitakshara law of succession, is wholly unknown to Muslim law. The law of inheritance in Islam is relatively close to the classical Dayabhaga law, though it differs also form that on several fundamental points. The modern Hindu law of succession (as laid down in the Hindu Succession Act, 1956) is, however, much different from both the aforesaid classical systems; it has a remarkable proximity, in certain respects, to the Muslim law of inheritance. 2. The division of heritage (daya) into sapratibandh ('obstructed') and apratibandh ('unobstructed')- self-acquired and ancestral- is equally foreign to Muslim law. 

\tWhatever property one inherits (whether from his ancestors or from others) is, at Muslim law, one's absolute property- whether that person is a man or a woman. 3. In Muslim law, so long as a person is alive he or she is the absolute owner of his or her property; nobody else (including a son) has any right, whatsoever, in it. It is only when the owner dies- and never before- that the legal rights of the heirs accrue. There is, therefore, no question of a would be- heir dealing in any way with his future right to inherit.4. The Indian legal concepts of 'joint' or 'undivided' family, 'coparcenary', karta, 'survivorship', and 'partition', etc., have no place in the law of Islam. A father and his son living together do not constitute a 'joint family'; the father is the master of his property; the son (even if a minor) of his, if he has any. 

\tThe same is the position of brothers or others living together. 5. Unlike the classical Indian law, female sex is no bar to inherit property. No woman is excluded from inheritance only on the basis of sex. Women have, like men, right to inherit property independently, not merely to receive maintenance or hold property 'in lieu of maintenance'.Moreover, every woman who inherits some property is, like a man, its absolute owner; there is no concept of either stridhan or a woman's 'limited estate' reverting to others upon her death. 6. The same scheme of succession applies whether the deceased was male or a female. This is one of those salient features of Muslim law of succession which distinguish it from modern Hindu law of inheritance."`,

3:`\tA Division Bench of this Court in Prakash v. Phulavati (supra) held that section 6 is not retrospective in operation, and it applies when both coparceners and his daughter were alive on the date of commencement of Amendment Act, 9.9.2005. This Court further opined that the provision contained in the Explanation to section 6(5) provides for the requirement of partition for substituted section 6 is to be a registered one or by a decree of a court, can have no application to a statutory notional partition on the opening of succession as provided in the unamended Section 6. The notional statutory partition is deemed to have taken place to ascertain the share of the deceased coparcener which is not covered either under the proviso to section 6(1) or section 6(5), including its Explanation. The registration requirement is inapplicable to partition of property by operation of law, which has to be given full effect. The provisions of section 6 have been held to be prospective.

\tIn Danamma (supra), this Court held that the amended provisions of section 6 confer full rights upon the daughter coparcener. Any coparcener, including a daughter, can claim a partition in the coparcenary property. Gurunalingappa died in the year 2001, leaving behind two daughters, two sons, and a widow. Coparcener's father was not alive when the substituted provision of section 6 came into force. The daughters, sons and the widow were given 1/5th share apiece. Arguments: Shri Tushar Mehta, learned Solicitor General of India, appearing on behalf of Union of India, raised the following arguments: (i) The daughters have been given the right of a coparcener, to bring equality with sons, and the exclusion of daughter from coparcenary was discriminatory and led to oppression and negation of fundamental rights. 

\tThe Amendment Act, 2005, is not retrospective but retroactive in operation since it enables the daughters to exercise their coparcenary rights on the commencement of the Amendment Act. Even though the right of a coparcener accrued to the daughter by birth, coparcenary is a birthright. (ii) The conferment of coparcenary status on daughters would not affect any partition that may have occurred before 20.12.2004 when the Bill was tabled before Rajya Sabha as contained in the proviso to section 6(1). Hence, the conferment of right on the daughter did not disturb the rights which got crystallised by partition before 20.12.2004.

\t(iii) Unamended Section 6 provided that if a male coparcener had left behind on death a female relative specified in Class I of the Schedule or male relative claiming through such female relative, the daughter was entitled to limited share in the coparcenary interest of her father not share as a coparcener in her rights. (v) The Explanation contained under Section 6(1) concerning conferral of rights as coparcener, daughter as coparcener, shall not affect or invalidate any disposition or alienation including any partition or testamentary disposition of the property which had taken place before 20.12.2004.`,
  
4:`\tPhulavati (supra) and Danamma v. Suman (supra). In both the decisions, the provisions of section 6 have been held to be of prospective application. The amendment is a prospective one. The declaration by the law that the daughter of a coparcener has certain entitlements and be subject to certain liabilities is prospective. The daughter is treated as a coparcener under the amendment Act and not because of the daughter's birth prior to the amendment.

\t(b) Unlike the joint tenancy principle in English law, a joint Hindu family stands on a different footing. Every son by birth became a coparcener, and because of birth, the son became entitled to be a coparcener in the joint Hindu family property entitled to claim partition with or without reference to the death of the Karta of a joint Hindu family. Like a son born into the family, an adopted son is also entitled to succeed to the joint family property. He becomes a coparcener with adoptive father, but his relationship with the natural family is severed, including his status as a coparcener in the family of birth as laid down in Nagindas Bhagwandas v. Bachoo Hurkissondas, AIR 1915 PC 41 and Nanak Chand & Ors. v. Chander Kishore & Ors., AIR 1982 Del. 520.

\t(c) A Hindu joint family consists of male members descended lineally from a common male ancestor, together with their mothers, wives or widows, and unmarried daughters bound together by the fundamental principle of a Sapindaship of family relationship is the essence and distinguishing feature of the institution of the coparcenary. A joint family may consist of a single male member and widows of deceased male members. This body is purely a creature of law and cannot be created by an act of parties, as observed in G. Narasimulu & Ors. v. P. Basava Sankaram & Ors., AIR 1925 Mad. 249; and State Bank of India v. Ghamandi Ram (dead) through Gurbax Rai, (1969) 2 SCC 33. An undivided family which is the normal condition of Hindu society is ordinarily joint not only in the estate but in food and worship, and, therefore, not only the concerns of the joint family but whatever relates to their commensality and their religious duties are regulated by the member or by the manager to whom they have expressly or by implication delegated the task of regulation as held in Raghunadha v. Brozo Kishore, 3 IA 154 (PC). 

\tThe coparcener status being the result of birth; possession of the joint property is only an adjunct of the joint family and is not necessary for its constitution, as discussed in Haridas Narayandas Bhatia v. Devkuvarbai Mulji, AIR 1926 Bom. 408. (d) A Hindu coparcenary is said to have seven essential characteristics, which include that the interest of a deceased member survives on his death and merges in the coparcenary property as observed in Controller of Estate Duty, Madras v. Alladi Kuppuswamy, (1977) 3 SCC 385. As a result, if father or any other coparcener has died before the Amendment Act, 2005, the interest of father or another coparcener would have already merged in the surviving coparcenary.`,

5:`\tConferment of coparcenary status shall take effect on and from the commencement "of the Amendment Act." The use of the words "on and from" in section 6(1) indicates that the daughter becomes coparcener from the commencement of the Act. The daughter of a coparcener shall by birth become a coparcener, have the same rights and be subject to the same liabilities. The word "shall" indicates the due status of the daughter as coparcener is created only for the future and would not affect the existing rights of a male coparcener. The use of the words "become," "have," and "be" are all present tenses, and they reiterate to support the above ­suggested interpretation.

\tIn the Bill recommended by the Law Commission and the Bill introduced, the Explanation to section 6(5) was not mentioned. It was introduced only on the recommendations of the Parliamentary Committee. Thus, the concept of partition by registered deed and decree of the Court were introduced. It follows that on a daughter becoming coparcener from a particular date, she cannot prospectively affect the share of a coparcener, which was already fixed as held in Prakash v. Phulavati. The essential condition for conferring the status of coparcener on the daughter is that there should be a coparcenary on the date of coming into force of the Act in 2005. If the coparcenary was disrupted by the act of the parties or by the death of parties, in partition or sale, the daughter could not get the status of a coparcener in coparcenary.

\tPartition could be in the form of a memorandum of partition, or it could also be made orally. In most of the families, there used to be an oral partition. Once parties settle their rights, the partition effected orally cannot be ignored to give shares to the daughters. Such legal transactions cannot be unsettled; the Explanation safeguards all genuine transactions of the past, including oral partition effected by the parties. The Explanation should not be understood as invalidating all other documents recording partition or oral partition in respect of coparcenary property before 20.12.2004.

\tDaughters conferred with the status of coparcener under the Amendment Act cannot challenge past transactions that took place before 20.12.2004, and the daughter should be alive as on the date of amendment. There should be 'living coparcener' to whom the daughter can inherit to become a coparcener. “Separation of share” is a species of “partition”. When all co- owners get separated, it is a partition. Separation of share(s) refers to a division where only one or only a few among several co-owners/coparceners get separated, and others continue to be joint or continue to hold the remaining property jointly without division by metes and bounds.  For example, where four brothers owning a property divide it among themselves by metes and bounds, it is a partition. But if only one brother wants to get his share separated and other three brothers continue to remain joint, there is only a separation of the share of one brother.`,

6:`\tThe parties to the litigation leading to this appeal are governed by the Aliyasantana law prevalent in the district of South Kanara. They were members of a Kutumba descended from a common ancestress by name Manjekke. One Parameshwari and her son and daughter instituted original suit No. 91 of 1950 before the Court of the Subordinate Judge South Kanara for partition of properties in accordance with the provisions of Madras Aliyasantana Act, 1949. The suit was dismissed, but on appeal the High Court reversed it. The High Court passed a preliminary decree on 28-6-1961 and remanded the suit for further proceedings. In the trial a joint memo was filed by the parties on 25th September 1963 accepting the shares as per the memo.

\tDefendants 22,23,24 were all male members of the 'Kutumba' and were 'Nissanthathi kavaru'. Onthe death of the 23rd and 24th defendants their legal Representatives who were brought on record filed R.I.A. No. 2266/66 and R.I.A. 2259/66 respectively claiming that out of the share allotted to the Kavarus ofdefendants 22 to 24, one-third representing the share or interest of the 23rd and24th defendants be allotted to them. The petition was opposed on the ground that each one of the defendants 22, 23, and 24 was a separate 'Nissanthathi Kavaru' and on the death of each of the defendants 24 and 23, his share or interest devolved upon the 'Santhathi Kavaru' nearest to him to which defendants 11,12 and16 belonged.

\tThe plea of the 22nd defendant was that all the three defendants 22, 23 and 24 constituted one single Nissanthathi Kavaru to which, under the preliminary decree one single or joint share was allotted and, therefore, the said share survived to the last surviving member thereof (22nd defendant) and that no devolution on a 'Santhathi Kavaru' under sub-section (5) of Section 36 is possible until the last member of 'Nissanthathi Kavaru' viz. the 22nd defendant dies.  The trial court found that in the High Court decree dated 20-6-1961 defendants 22to 24 were allotted shares jointly. It further held that defendants 22, 23 and 24 formed three 'Nissanthathi Kavarus' as their mother was dead at the time of the filling of the suit and partition was effected and there was no undivided interest in the property when they died so as to attract the provisions of section 7(2) of the Hindu Succession Act.

\tThe explanation to Section 7(2) of the Act provides that the interest in the property of the Kutumba or Kavaru of a Hindu shall be deemed to be the share in the property of the Kutumba or Kavaru, asthe case may be, that would have fallen to him or her if a partition of that property per capita had been made immediately before his or her death among all the members of the Kutumba or Kavaru, as the case may be, then living whether he or she was entitled to claim such partitionor not under the Aliyasantana law and such share shall be deemed to have been allotted to him or her absolutely.`,

7:`\tThis section incorporates quotations from Narada and Vasishta and produces categories of persons, who, in a Court of Law nowadays would not be held disqualified from inheritance. They are brought under the text of Yajnavalkya who adds the Sanskrit word "Adya" translated by Colebrooke as "as well as others;" its literal meaning being  and the like" or practically, "etc., etc." Under cover of the latitude afforded by this expression placitum 3 brings in such intangible persons as "an enemy to his father" and " one who is addicted to vice" --disqualifications so vague, it is clear, that no Court of Law could now assert their validity. I do not think it right to say that these grounds of exclusion are obsolete or that they were originally intended to be moral rather than legal obligations: but rather that they are of so nebulous a character that they could never have been enforcible at any time when the enunciation of the rights of inheritance passed from the hands of family mediators or village panchayatdars to anything which can be dignified by the name of "Court of Law."

\tI do not think that any useful purpose would be served by inquiring into the meaning of such terms as "Mrindriya" or "Pangu." They do not seem to me to assist the present discussion and I think it is probable that legislation will abolish the exclusion from inheritance based on these terms before the Courts are called upon to determine their exact meaning. Similarly I think it unnecessary to discus whether Yajnavalkya meant anything more by using the word "Andha" than what Manu meant by ''Jathyandha". "Jati" comes from the same root as the Greek Gignomai, Genes, etc., and Latin "Genus." It is, I think, clear that both Manu and the Mitakshara explicitly lay down the rule of law that at least a "Jathyandha" is excluded from inheritance and that the only way to escape from this is to do what SADASIVA AYYAR, J., has done and say boldly It is not a subsisting rule of law. It has become obsolete and abrogated.

\tIn any system of law other than the Hindu Law, it would be almost a contradiction in terms to predicate of any proposition of law that it is obsolete. In the Hindu Law it is a possible state of things and it has been admitted to exist with regard to many maxims which cannot be treated as of merely moral or religious obligation. I need only instance the kinds of marriages and the classes of sons enumerated in the ancient writings and also the various rules for marriages between persons of different castes.

\tThere is a consensus of opinion that there are only two forms of marriages and only two classes of sons now existing and intermarriages between persons of different castes have in practice long ceased to exist. It is not now possible to trace the steps by which this state of things came about, but it may be said generally, that, in the days when the Sudder Court had recourse to the opinions of the Pandits, the latter felt themselves quite free to say with regard to any rule of law that, in practice, it was regarded as obsolete and the Courts felt themselves equally free to act on such opinions.`,

8:`\tThe position with regard to the present question is that there is no express ruling of a Court of Law which says, in terms, that a congenitally blind man is excluded from inheritance. There are cases which definitely decide that blindness which is not congenital but is traumatic or supervenes on disease does not exclude. There are many cases which assume, without expressly deciding, that congenital blindness does exclude. That position is now challenged and it devolves upon us to say how the law on the subject stands in India at this day.

\tThat which we call the Hindu Law, is composed of many incongruous elements--I am speaking, now, of its substance, and not of the sources in which it is to be sought. It primarily lays down rules of law, which must be treated as of practical applicability to the India of to-day. Such rules there are in abundance, but they are interspersed with mandatory precepts which have been treated by commentators and Judges as being merely of religious or moral force but which cannot govern the rights and duties of a member of a Hindu family with the force of a positive rule of law. I may refer in this connexion to the words of the Judicial Committee in Balwant Singh v. Rani Kishori (1886) I.L.R,, 9 Mad., 64 (F.B.).).

\tAll these old text boots and commentaries are apt to mingle religious and moral considerations, not being positive laws, with rules intended for positive laws. In his preface to his valuable work on Hindu Law, Sir W. Macnaghten says : 'It by no means follows that because an act has been prohibited it should therefore be considered as illegal. The distinction between the Vinculam juris and the Vinculam pudcns is not always discernible.' (Hindu Law, Principles and Precedents, page 6 of the preliminary remarks.) He illustrates this position by the example of the very subject, of the present discussion. It is, as their Lordships think, the most remarkable inference that the passage in Section 1 belongs to the former class of precepts, and those of Sections 4 and 5 to the latter.

\tIt was argued in this case that the rule which excludes a blind man from inheritance was something other than a rule of positive law. It seems to me that that position is wholly untenable and that such a principle of exclusion can only belong to the domain of positive law, and not to that of either religion or morality. If it is riot a rule of law. it must be meaningless. The only colour to the argument is derived from the fact that both Manu and Mitakshara, to which for the moment I shall confine myself, include within the ambit of their prohibition, persons with disqualifications which are obviously based on moral grounds and on grounds which it would be impossible for a Court of Law to pronounce upon. It must not be forgotten that the Hindu Law is the result of many ingredients. In the first place, we have the Smritis or records of the pronouncements of Rishis, (Saints) among whom stands paramount Manu.`,

9:`\tIn Vaidyanatha Ayyar v. Chinnasami Naik (1894) I.L.R., 17 Mad., 108, it was held that a succession certificate was necessary where a suit was filed on a promissory note executed in favour of two Hindus carrying on business in partnership, by the surviving partner and the heirs of the deceased partner. In Rajah of Kalahasti v. Achigadu (1907) I.L.R., 30 Mad., 464, it was held that a succession certificate was necessary when the successor to an impartible estate sued on a bond executed in favour of the deceased zamindar, as he derived his title to such debt only on the death of his predecessor as part of his effects. 

\tIt is, however, now settled that it is not necessary that the fact that the debt was a debt due to the joint family should appear on the face of the bond but that this can be proved aliunde: Subramanian Chetti v. Rakku servai (1897) I.L.R., 20 Mad., 232, Ramanatham Chatty v. Subramaniyan Chetty (1915) 28 M.L.J., 372, and Jagmohandas Kilabhai v. Allu Maria Duskal (1895) I.L.R., 19 Bom., 338, In Raghivendra Madhav v. Bhima (1892) I.L.R., 16 Bom., 349, it was held that a succession certificate was necessary, if a decree obtained by one of two undivided brothers was the separate property of the deceased decree-holder, as the surviving brother can only execute as his heir. It is clear from the authorities that the fact that the plaintiff was a member of a joint and undivided family with the deceased, and owned joint properties which passed to him by survivorship, would not prevent the necessity for the production of a succession certificate in regard to the separate property of the deceased, inasmuch as the debt would still be the effects of the deceased person.

\tSo far as the text of the Mitakshara dealing with the rights of sons in their father's self-acquisitions is concerned it has been decided by their Lordships of the Privy Council in Balwant Singh v. Rani Kishori (1898) I.L.R., 20 All., 267 (P.C.), that the text: though immovables or bipeds have been acquired by a man himself, a gift, or sale of them should not be made without convening all the sons. They who are born and they who are yet unbegotten and they who are still in the womb, require the means of support. No gift or sale should therefore be made, is only a moral precept and not a rule of law capable of being enforced. As pointed out in Muddun Gopal Thakoor v. Ram Buksh Pandey (1863) W.R. (Civil Rulings), 71 and Jugmohandas Mangaldas v. Sir Mangal das Nathubhoy (1886) I.L.R., 10 Bom., 528, the son acquires no legal rights over his father's self-acquisitions by reason of the text of the Mitakshara (Ch. I, Section I, 27), but his right is an imperfect one incapable of being enforced at law.

\tAssuming that the imperfect right of the son in his father's self-acquisition may have sufficient efficacy to entitle him to succeed to it to the exclusion of a divided son, it does not follow that the self-acquired property does not form part of his father's "effects" within the meaning of Section 4 of the Succession Certificate Act.`,

10:`\tThis letter shows that the assessee had received funds amounting to more than Rs. 80,000 for construction of the houses and marriage expenses of his daughter from time to time. This is further clear from the letter dated 14th December, 1957 written by the appellant's father from New Delhi enclosing a cheque for Rs. 2,000 as desired by the appellant. This letter further shows that the construction of the house bearing Door No. 26 was completed by December 1957. We further find that the appellant had written a letter to the Income-tax Officer on 8-10-1965 in the course of his wealth-tax assessment proceedings for 1965-66 wherein he had stated that he had purchased a plot of land for Rs. 10,000 in 1954, out of which nearly five to six thousand rupees would have come from his father. 

\tIn his letter dated 15-1-1983 addressed to the Appellate Asstt. Commissioner, the appellant has mentioned these facts in para 2 of his letter and further referred to the remittance of Rs. 35,000 received from his father on 11-12-1961 for the purpose of constructing a property on an unfinished construction in 71/9, Mowbrays Road, which he had purchased for Rs. 20,000 from one Mrs. S.G. Navnitammal on 9-9-1961 and on which property he had spent a further sum of Rs. 40,000. While explaining the source for this investment, the appellant had stated that he had borrowed Rs. 22,000 on 4-9-1961 and another sum of Rs. 11,000 on 19-9-1961 from one Shri S. Thyagarajaiyer, Advocate and that his father had remitted to him a sum of Rs. 35,000 on 11-12-1961. 

\tHe further stated in this letter that he sold away this property as his father did not like the location and thereafter he purchased another property bearing No. 19A & B, Sitamma Colony, which also he sold away as there was a serious theft in the said house and his family members did not want to stay in the said house also thereafter. It is after selling away this property which he had purchased in Sitamma Colony that he ultimately constructed the new block No. 26-B with the sale proceeds. The appellant therefore explained that the amount of Rs. 35,000 received by him from his father was always available in one form or another for the acquisition and the construction of the various properties. Thus, it is clear from the materials placed before us that the appellant had received in all a sum of Rs. 40,000 to Rs. 43,000 for the construction of the house properties from 1954 to 1961, apart from other funds received from his father on the occasion of the marriage of his daughter.

\tAs a matter of fact, the conflict of decisions among the various High Courts, on the issue under the Gift-tax Act, was finally resolved by the Supreme Court in Goli Eswariah v. CGT [1970] 76 ITR 675. At pages 678 and 679 of the Reports, the Supreme Court held as follows. It is obvious that the principles of succession are different as amongst these three groups. In the first, it is by survivorship (even in respect of the father's self-acquired property, according to the scheme of the Mitakshara).`,

11:`\tMohammedan Law, being the personal law, possesses its own legal principles and regulations which govern family relationships in matters such as marriage, divorce, inheritance, custody and guardianship. Its distinctive feature sets it apart from other personal laws on fundamental issues. It is pertinent to examine the legal principles, if any, governing partition under Mohammedan law. Tahir Mahmood, in his book ‘The Muslim Law of India’, 2nd Edition, Chapter 12 (Law of Inheritance) Para II, has provided for various concepts related to succession in Muslim Law which distinguish it from other personal laws: “1. The Muslim law of succession is basically different from the parallel indigenous systems of India.

\tThe doctrine of janmswatvavada (right by birth), which constitutes the foundation of the Mitakshara law of succession, is wholly unknown to Muslim law. The law of inheritance in Islam is relatively close to the classical Dayabhaga law, though it differs also form that on several fundamental points. The modern Hindu law of succession (as laid down in the Hindu Succession Act, 1956) is, however, much different from both the aforesaid classical systems; it has a remarkable proximity, in certain respects, to the Muslim law of inheritance. 2. The division of heritage (daya) into sapratibandh (‘obstructed’) and apratibandh (‘unobstructed’)-self-acquired and ancestral- is equally foreign to Muslim law. Whatever property one inherits (whether from his ancestors or from others) is, at Muslim law, one's absolute property- whether that person is a man or a woman. 3. In Muslim law, so long as a person is alive he or she is the absolute owner of his or her property; nobody else (including a son) has any right, whatsoever, in it. It is only when the owner dies- and never before- that the legal rights of the heirs accrue.

\tThere is, therefore, no question of a would be heir dealing in any way with his future right to inherit. 4. The Indian legal concepts of ‘joint' or 'undivided' family, 'coparcenary', karta, 'survivorship', and 'partition', etc., have no place in the law of Islam. A father and his son living together do not constitute a ‘joint family'; the father is the master of his property; the son (even if a minor) of his, if he has any. The same is the position of brothers or others living together. 5. Unlike the classical Indian law, female sex is no bar to inherit property. No woman is excluded from inheritance only on the basis of sex. Women have, like men, right to inherit property independently, not merely to receive maintenance or hold property ‘in lieu of maintenance'. Moreover, every woman who inherits some property is, like a man, its absolute owner; there is no concept of either stridhan or a woman's ‘limited estate' reverting to others upon her death. 6. The same scheme of succession applies whether the deceased was male or a female. This is one of those salient features of Muslim law of succession which distinguish it from modern Hindu law of inheritance.”`,

12:`\tThe instant appeals, preferred by the original defendants, arise out of the judgment and order dated 13.01.2006 passed by the High Court of Karnataka whereby it dismissed the appeals filed by the original-defendants, confirming the decree passed by the Court of the Principal Civil Judge (Sr. Dn.)1, Bijapur in O.S. No.140 of 1988 in favour of the original plaintiffs (Respondents herein). Hereinafter referred to as ‘Trial Court’ 1-CIVIL APPEAL NO.4211 OF 2009  2. Admittedly, the parties are governed by Mohammedan law. 

\tThe following questions arise for our consideration:- (a) Whether an owner of property can, in his lifetime, transfer said property to his heirs by way of partition? (b) Whether, in the facts of this case, the requisites of a valid gift were met and also whether nomenclature employed in Mutation Entry can be said to be indicative of intentions? FACTUAL MATRIX 3. The brief facts are stated by referring to the parties as per their status in the Trial Court. 4. One Sultan Saheb, the owner of the suit land described in Schedule B and C being agricultural land and house property respectively, of the plaint, died on 09.01.1978. Through his first marriage, he had one daughter namely, Ajamunisa (defendant no.11). With his first wife passing away, he remarried and, from this second marriage, had three children- two sons, namely Mansoorsaheb (defendant no.1), Sikandar (defendant no.9) and daughter namely, Rabiyabi. Plaintiff nos.1 to 9 are the children of Rabiyabi, who had died on 08.06.1985. Defendant no.2 is Mansoorsaheb’s wife, defendant nos. 3 to 7 are his children, defendant no.8 is defendant no.1’s daughter-in-law. 

\tDefendant no.10 is the son of defendant no.9. For ease of understanding, the position of parties is demonstrated through a family tree: 2-CIVIL APPEAL NO.4211 OF 2009  5. The case of the plaintiffs is that Sultan Saheb was the owner and possessor of the suit property. On his death, defendant no.1 got his name, as also the names of defendant no. 9 & 11 mutated in the revenue records to the exclusion of the plaintiffs’ mother, Rabiyabi, also a successor-in-interest. As such, plaintiffs are entitled to 1/6th share in different scheduled properties and sought partition by way of O.S. No.140/1988. 6. In their written statements, the defendants contended that Sultan Saheb himself had divided the property, R.S.No.249/1A/1, into three parts, gifting one part each to his sons and retaining the third remaining part. Subsequently, in September 1980, he partitioned the retained third portion among his four children. Reliance is placed on the Mutation Entry No. 8258 dated 21.01.1973, which is disputed by the plaintiffs.

t\“A hiba is a voluntary gift without consideration of property or the substance of thing by one person to another so as to constitute the donee the proprietor of the subject matter of the gift.” While referring to Mohammedan Law, by Syed Ameer Ali18, the Privy Council in Mohd. Abdul Ghani v. Fakhr Jahan Begam19 observed.`,

13:`\tThese petitions by the holder of Kavalappara Sthanam, his wife, daughters and soil challenged the constitutional validity of the Madras Marumakkathayam (Removal of Doubts) Act, 1955 passed by the Madras Legislature soon after the Privy Council had declared the properties in possession of the Sthanee to be Sthanam properties in which the members of the tarwad had not interest.

\tSection 2 Of the Act, which contained the substantive provision, was as follows:--  "2. Notwithstanding any decision of Court, any sthanam in respect of which:- (a) there is or had been at any time an intermingling of the properties of the sthanam and the properties of the tarwad, or  (b) the members of the tarwad have been receiving maintenance from the properties purporting to be sthanam properties as of right, or in pursuance of a custom or otherwise, or (c)there had at any time been a vacancy caused by there being, no male member of the tarwad eligible to succeed to the Sthanam, 888 shall be deemed to be and shall be deemed always to have been a Marumakkathayam tarwad and the properties appertaining to such a sthanam shall be deemed to be and shall be deemed always to have been properties belonging to the tarwad to which -. he provisions of the Madras Marumakkathayam Act, 1932 (Mad. XXII of 1933), shall apply." The question for decision was whether the impugned Act infringed the fundamental rights of the petitioners guaranteed by Arts. 4, 19(1)(f) and 31 of the Constitution.

\tHeld (per Sinha, C. J., Subba Rao and Shah, JJ.) that the three tests laid down by the Act were contrary to the well- settled principles of Marumakkathayam Law with regard to which there could be no scope for doubt and as such not only not germane but extraneous to the object it sought to achieve. They were a device to deprive the sthanam of its properties and vest them in the tarwad and as such directly hit by Art. 19(1)(f) and could not be saved by Art. 19(5). Assuming that the Sthanam properties were held in janmam right and as such were estates within the meaning of Art. 31A, the impugned Act was immune from challenge. That Article, properly construed, envisages agrarian reform and provides for the acquisition, extinguishment or modification of proprietary and various other kinds of subordinate rights in a tenure called the estate solely for that purpose and must be limited to it. 

\tAlthough it may not be permissible to refer to the statement of objects and reasons of its amendment for purposes of construction, it can be referred to for the limited purpose of ascertaining the conditions prevailing at the time and purpose underlying the amendment. Aswini Kumar Ghose v. Arabinda Bose, [19531 S.C.R. 1,considered.Learned counsel for the respondents while countering the arguments advanced by the learned Attorney-General raised two further points, viz., (1) the petitioner's sthanam is an "estate" within the meaning of Art. 31A of the Constitution and therefore the Act extinguishing or modifying the rights pertaining to the said sthanam cannot be questioned on the ground that it infringes Arts.`,

14:`\tIn his deposition on 18.07.2013, PW-3, one Mr. N.V. Satyanarayan, Defence Estate Officer, Delhi Circle, has admitted that the mutation of Bungalow No. 4, University Road, Delhi had been done in the name of Shri R.N. Gupta (Karta); that it is borne out from the summoned record, i.e., a copy of the letter dated 01.06.85, addressed to Mrs. Shanta K. Mohan, w/o Late Sh. Kishan Mohan, 18, Anand Lok, New Delhi regarding mutation in the name of successor of Late Sh. Kishan Mohan, Karta (JHUF) in respect of 4, University Road, Delhi and letter dated 5.8.2003 from his office addressed to Sh. R.N. Gupta (Karta) & others, 4, University Road, Delhi on the subject "Mutation of Bungalow No.4, University Road, Delhi in the name of Legal Heirs." In this letter, it was contended that Mr. R.N. Gupta was the sole surviving son of Mr. D.R. Gupta and that he was thus the Karta of the said JHUF.

\tIt is not in dispute between the parties that the plaintiff is the eldest surviving member of the HUF. Accordingly, she seeks a decree in terms of the relief sought in the suit. The learned counsel for the plaintiff relies upon the case of Raghunath Rai Bareja and Another vs. Punjab National Bank and Others (2207) 2 SCC 230 which held that, under the Dayabhaga School of Law, an unborn son cannot have a right in the property because the said son cannot perform Shradha whereas, under the Mitakshara School of Law, an unborn son in the womb of his mother gets a share in the ancestral property. The rights of an unborn son in the mother‟s womb under the Dayabhaga School of Law are premised on the ability of the child to offer a rice ball or to conduct such necessary rituals for the benefit of the departed souls of his ancestors. 

\tUnder the Mitakshara School of Law, emphasis is on the right of inheritance of the child and therefore, it rests upon consanguinity rather on upon the inheritance efficacy. It is contended that Section 6 of the Hindu Succession Act extends this element of consanguinity to female coparceners of a HUF under the Mitakshara School of Law to all aspects of inheritance, which would include the right to manage a ritual or property as its Karta, being the eldest of the co- parceners. She submits that by virtue of the family settlement dated 01.04.1999 (Ex. PW1/5), the rights of the parties, then existing, were settled. 

\tIt was agreed that: "2. The parties hereto confirm and declare that the oral family settlement dated 18.01.1999 was arrived at on the following terms: 2.1 The parties acknowledge and confirmed that the parties hereto are the members of the Hindu Undivided family D.R. Gupta and Sons (HUF) and each having share in the movable and immovable properties presently owned by the Hindu Undivided Family as under: (a)Shri Krishan Mohan Gupta (The eldest son of late Shri D.R. Gupta who died on 17th Feb., 1984) and is survived by his wife Smt. Shanta K. Mohan And Mrs. Sujata Sharma & Mrs. Radhika Seth, daughter, heirs to the party of the "First part" - 1/5th share.`,

15:`\t"It may be mentioned in this connection that the first and foremost principle of interpretation of a statute in every system of interpretation is the literal rule of interpretation. The other rules of interpretation e.g. the mischief rule, purposive interpretation etc. can only be resorted to when the plain words of a statute are ambiguous or lead to no intelligible results or if read literally would nullify the very object of the statute. Where the words of a statute are absolutely clear and unambiguous, recourse cannot be had to the principles of interpretation other than the literal rule, vide Swedish Match AB vs. Securities and Exchange Board, India, AIR2004 SC 4219. As held in Prakash Nath Khanna vs. C.I.T. 2004 (9) SCC 686, the language employed in a statute is the determinative factor of the legislative intent. The legislature is presumed to have made no mistake.

\tThe presumption is that it intended to say what it has said. Assuming there is a defect or an omission in the words used by the legislature, the Court cannot correct or make up the deficiency, especially when a literal reading thereof produces an intelligible result, vide Delhi Financial Corporation vs. Rajiv Anand 2004 (11) SCC 625. Where the legislative intent is clear from the language, the Court should give effect to it, vide Government of Andhra Pradesh vs. Road Rollers Owners Welfare Association 2004(6) SCC 210, and the Court should not seek to amend the law in the grab of interpretation."

\tThe learned counsel further relies upon Ganduri Koteshwar Ramma & Anr. v. Chakiri Yanadi & Anr., (2011) 9 SCC 788 which, in the context of Section 6 of the Hindu Succession Act, held that rights in the co- parcenary property among male and female members of a joint Hindu family are equal on and from 9.9.2005. He submits that the legislature has now conferred a substantive right in favour of the daughters; that by Section 6, the daughter of the co-parcenar shall have same rights and liabilities in the co-parcenary property as she would if she had been a son; thus, on and from 9.9.2005, the daughter is entitled to a share in the HUF property and is a co-parcenar as if she had been a son. The Supreme Court relied upon its own judgment in S.Sai Reddy v. S. Narayana Reddy and Ors. (1991) 3 SCC 647 which held that the Hindu Succession Act was a beneficial legislation and had been placed on the statute book with the objective of benefitting a woman's vulnerable position in society.

\tHence, the statute was to be given a literal effect. It is, however, required to be noted that the Court was then considering Section 29(a) of the Act and not Section 6. Explanation.-For the purposes of Clause (a), the expression "son", "grandson" or "great-grandson" shall be deemed to refer to the son, grandson or great-grandson, as the case may be, who was born or adopted prior to the commencement of the Hindu Succession (Amendment) Act, 2005 (16 of 1908) or partition effected by a decree of a court.`,

16:`\tOrder of succession among heirs in the Schedule. -Among the heirs specified in the Schedule, those in class I shall take simultaneously and to the exclusion of all other heirs; those in the first entry in class II shall be preferred to those in the second entry; those in the second entry shall be preferred to those in the third entry; and so on in succession. Ms. Mala Goel, the learned counsel for plaintiff refers to the same locus classicus by Mulla on principles of Hindu laws which states as under "The right to become a manager depends upon the fundamental fact that the person on whom the right devolved was a coparcener of the joint family... Further, the right is confined to the male members of the family as the female members were not treated as coparceners though they may be members of the joint family."

\t"By virtue of the new provision, a daughter of a coparcener in a joint Hindu family governed by the Mitakshara law now becomes a coparcener in her own right and thus enjoys rights equal to those hitherto enjoyed by a son of a coparcener. The implications of this fundamental change are wide. Since a daughter now stands on an equal footing with a son of a coparcener, she is now invested with all the rights, including the right to seek partition of the coparcenary property. Where under the old law, since a female could not act as karta of the joint family, as a result of the new provision, she could also become karta of the joint Hindu family. Issue 1 This issue was decided in favour of defendant Nos. 1 to 4 by this Court, which was subsequently set aside in Appeal No.293/2010 on 17.01.2013, therefore, this issue stands settled in favour of the plaintiff."

\tThe learned counsel for the plaintiff further relies upon the 174th Report of the Law Commission of India, which has argued that when women are equal in all respects of modern day life, there is no reason why they should be deprived of the right and privilege of managing HUF as their Karta. She argues that it is in this context, that Section 6 was so formulated that it covers all aspects of succession to a coparcener which are available to a male member to be equally available to a female member also. Viswanatha Sastri J. said : "The managership of a joint Hindu family is a creature of law and in certain circumstances, could be created by an agreement among the coparceners of the joint family. Coparcenership is a necessary qualification for managership of a joint Hindu family."

\tInsofar as the plaintiff father had passed away prior to the aforesaid amendment and there being no testamentary succession in her favour she would not have any rights into the co-parcenary. Upon the query put to counsel he submits that if the survivor of Mr. Krishan Mohan Gupta had been male then he would have rights in the co-parcenary. Explanation.-For the purposes of Clause (a), the expression "son", "grandson" or "great-grandson" shall be deemed to refer to the son, grandson or great-grandson, as the case may be, who was born or adopted prior to the commencement of the Hindu Succession (Amendment) Act, 2005.`,

17:`\tThe argument of the petitioners' counsel under Article 14 was, that whereas the terms "individual" and "Hindu undivided family" are units of assessment under Section 3, non-Hindu undivided families, such as Moplah Marumakkathayam tarwads in North Malabar and elsewhere and Christian joint families following the Hindu 'Law in Mysore and Coorg and elsewhere, are not such units, not being comprehended by the terms "individual" and "Hindu undivided family", with the result that with respect to them, Hindu undivided families have been discriminated against and alternatively, that if non-Hindu undivided families as aforesaid are looked upon as groups of individuals and therefore comprehended by the term "individual", 'these families have been discriminated against by reason of the schedule of the Act, Part I, Paragraph A, which has prescribed a lower limit of exemption for "individual" as against a higher limit for "Hindu undivided family" and that, if for that reason, non-Hindu undivided families are excluded as discriminated against, such exclusion in itself would spell discrimination against Hindu undivided families.

\tLearned counsel for the Revenue answered, that the term "Hindu undivided family" includes not only Hindu Mitakshara and Dayabhaga joint families, but also all undivided families of Hindus, such as, Namboodiri Makkathayam families, Hindu Warumakkathayam tarwads, such as Nair and 'Ezhava tarwads, that they are being assessed under the Act as "Hindu undivided family", that non-Hindu undivided families are comprehended by the term "individual" and are being assessed as such, and that in any event Moplah Marumakkathayam tarwads are so insignificant in number compared to the large number of Hindu undivided families in the Indian Union, that their exclusion either through inadvertence or otherwise is not discriminatory and would not attract Article 14. 

\tMahaviraprasad Badridas v. Yagnik, 1959-37 ITR 191: (AIR 1960 Bom 191), a case referred to by that court was decided under Entry 86 and in Commissioner of Income-tax v. Sen Sodra Devi, 1957-32 ITR 615: ( (S) AIR 1957 SC 832) also relied on, the Supreme Court. Though the counters filed by the 'Revenue are not quite clear on the point, it seemed common ground at the hearing of the petitions, that the term "Hindu undivided 'family" in Section 3 is comprehensive to include all joint or undivided families composed of those who follow the Hindu religion, whatever be their personal law, whether Makkathayam or Marumakkathayam or Aliyasanthana or Mitakshara or Dayabhaga law, but not Moplah Marumakkathayam tarwads, or other non-Hindu undivided families.

\tSome of the cases concerned a body of trustees or other association of individuals, as in Hotz Trust of Simla v. Commissioner of Income-tax, AIR 1930 Lah 929 or a partnership formed by two firms and a Hindu undivided family, as in Mian Channu Factories Union v. Commissioner of Income-tax Punjab, 1936-4 ITR 203; (AIR 1936 Lah 548) or a co-operative society being a corporate body created by statute, as in Commissioner of Income-tax v. Salem District Urban Hank Ltd., 1940-8 ITR 269: (AIR 1940 Mad 612 (SB) ).`,

18:`\tThere is a presumption, that Moplahs of North Malabar, to which category the petitioner in O. P. 674 of 24.03.1958 belongs, generally follow Marumakkalhayam law. This has been ruled by this Court in Koyyotan Sooppi v. Kalliani, 09.11.1957 Ker LJ 862. In Kunhi Pat minima v. Sundara Ayyar, AIR 14/08/1946 Mad 32 a division bench of the Madras High Court held, that a Moplah family of North Malabar "is governed by the Marumakkathayam law in all matters relating to property unless there happens to be private property undisposed of by will. 

\tTherefore, in most matters the Marumak-kathayam law must be regarded as governing the family". In Chakkra Kanna v. Kunbi Pokker, ILR 39 Mad 3)7: (AIR 1916 Mad 391 (KB) ) Srinivasa Ayyangar, J. observed thus at page 336 (of ILR Mad): (at p. 400 of AIR): "But the more common and familiar instances of such groups in Southern India are the joint Hindu family governed by the Mitak-shara law, the Nambudiri Illom governed by the Makkattayam law, the Nayar tarwad governed by the Marumakkathyam law, and the Aliyasantan family of South Canara.The Mappillas of North Malabar generally follow the Marumakkattayam system and the parties to this suit are governed by that law. The incidents of such group holding are now welt settled.

\tIn the case of Malabar tarwads such incidents include the impartibility of the property, the right by birth of persons born in the tarwad, and the management of the properties by the senior male member of the tarwad who is styled the karnavan." Raja of Arakal v. Churia Kunhi Kannan, 29 Mad LJ 632: (AIR 1916 Mad 976) related to the family of Arakal Raja, a Moplah tarwad, and it was held that the junior members have a right to take steps necessary for the protection of the interests of the tarwad. In Arayal-prath Kunhi Pocker v. Kanlhilath Ahmad Kuts Haji, ILR 29 Mad 62 it was held, that the members of a Moplah tarwad can divide property by mutual consent, though no suit for compelling a partition will lie.These were all cases decided before the passing of the Mappilla Marumakkathayam Act, 1938. The several statutes affecting Moplahs of the former Malabar District may be briefly surveyed. 

\tThe Malabar Wills Act, 1898, was enacted to make provision for the execution of Wills by Marumakkathayees or persons governed by the Maraumakkathayam or Aliyasan-thana Law of inheritance. The Mappilla Succession Act, 1918, was, to extend the rules of Muhammadan law of intestate succession and the Mappilla Wills Act, 1928, was to extend the rules of Muhammadan law of testamentary dispositions, to Mappillas governed by the Marumakkathayam or the Aliyasanthana Law of inheritance, but these had nothing to do with a Moplah tarwad or its properties. In my view, a comparative study of the Madras Marumakkathayam Act, 1932, and the Mappilla Marumakkathayam Act, 1938, reveals a striking similarity between the tar-wads dealt with by them. The basic concepts, like karnavan, anandiravan, tarwad, and tavazhi are practically the same.`,

19:`\tWhile the Madras Marumakkathayam Act gave a right for tavazhi partition, the other Act conferred a right of individual partition as well. Under both, division has to be on a per capita basis. There is a saving in both, of the rules of Marumakkathayam law, custom, and usage, except to the extent specifically provided for. The rules of intestate succession are however different, the Mappilla Marumakkatham Act providing for succession according to the Islamic Law of Inheritance. In A. Section 452 of 1945 (Mad) decided by Rajamannar, C. J. and Raghava Rao, J., the Madras High Court applied the rule of severance of status laid down in decisions rendered under the Madras Marumakkathayam Act, 1932, to Moplah tarwads and observed:

\t"We have carefully considered the material sections of both the Acts, namely, Section 38, 39 and 40 of the Marumakkathayam Act of 1933 and Section 13, 14 and 17 of the Moplah Marumakkathayam Act, 1939 and we see no such difference in language as would justify us in not applying the principles laid down in the decisions above referred to to the case of a Moplah tarwad." In Lakshmanan v. Kamal, AIR 1959 Kerala 67 (FR), this Court held that "the Shariat Act did not abolish or purport to abolish the rights and incidents of a Mappila Mavumakkathayam tarwad." The right of individual partition, was conferred by the Madras Marumakkathayam (Amendment) Act, 1958. Quite recently, in Muthia Chettiar v. Wealth Tax Officer, 1964-2 Mad LJ 273 while holding that Marumakkathayam tarwads and joint families governed by the Hindu law are not similarly situated, the Madras High Court made the following observations at pages 282 and 283 of the report:

\t"We have already pointed out that these Mappilla tarwads occupied the same position as the Nair tarwad in the Malabar area. We have to take it that, prior to the enactment of the Madras Marumakkattayam Act, 1932, and the Mappilla Marumakkattayam Act, 1939, the Mapilla tarwad and the Nair tarwad stood more or less in the same position except as regards marriage, divorce, succession to separate property etc. We find that on important matters like the right of division and the quantum of share, the tarwad, Hindu or Muslim in Malabar, differs substantially from the Hindu undivided family."

\tI consider that on both these grounds, the assessment order in 0. P. 684 of 1959 could not be supported; it is quashed accordingly. O. P. 684 of 1959 is allowed. O. P. 674 of 1958 also is allowed, on the ground that the Moplah Marumakkalhayam tarwad of the petitioner is outside the purview of Section 3 of the Act. The demand nolice is quashed. The parties in both these petitions shall bear their costs. In the decision reported in Mammad Keyi v. Wealth Tax Officer, Calicut, 1961 Ker LJ 1046; (AIR 1962 Kerala 110) legislative competence was upheld by a Division Bench of this Court. On the provisions of the Act as they stand at present Shri. M. K. Nambiar, counsel for the petitioner, raised the following contentions.`,

20:`\tThe point as to discrimination is, that by the exclusion of Moplah tarwads from the imposition under the Act, Hindu undivided families have been singled out. On the last occasion, the division bench decided the point against the Revenue on two grounds, first, that on the materials before it, it could not be held as contended, that Maplah tarwads constituted only an insignificant minority and second, that the classification of joint families into Hindu undivided families and Moplah tarwads had no reasonable relation to the object of the Act. On appeal, the Supreme Court remanded the cases observing that "it is for the party who comes forward with the allegation, that equality before the law or the equal protection of the laws is being dented to him to adduce facts to prove such denial".

\tAccordingly, the burden of establishing the plea has been cast on the petitioners and has been rightly undertaken by them. Fresh affidavits have been filed in O. P. fi84 of 1959 and O. P. 674 of 1958. In the affidavit of the petitioner in 0. P. 684 of 1959 dated the 26th June, 1954, it was averred, that there are 22 karnavans of Moplah tarwads, "who are even now being assessed to wealth tax as individuals", in respect of the net wealth of the tarwads. Though this was not controverted in the counter, it was stated in paragraph 2, that the "non-Hindu undivided families which are in the ordinary course liable to assessments to wealth lax from 1957-68 onwards in respect of the whole of India are only 18 in number", the number in this State being 1.

\tThe petitioner denied this in his reply and explained, that apparently this has reference to "those non-Hindu families, who have been assessed to wealth-tax as such and not the very large number of undivided families which are being taxed only as individuals". This is not clear, for non-Hindu families are not assessed as families but only as individuals. In the affidavit dated the 6th November, 1964, the number of Hindu undivided families assessed to wealth tax in the year 1961-62 was stated to be 34 and in the year 1962-63 to be 23, At the hearing, learned counsel for the respondent stated, that the list of 22 karnavans of Moplah tarwads furnished in paragraph 3(vi) of the affidavit of the petitioner may be taken as correct.

\tThus, the number of Moplah tarwads in North Malabar who are now assessed to wealth lax as individuals may be taken to be 22. A comparative estimate is not possible, without even a rough idea as to the number of wealthy Hindu undivided families, of all categories in the whole of India. This was necessary as a part of the petitioner's plea of discrimination. The respondent has stated in the counter, that considering the population of India, the number of non-Hindu undivided families is insignificant and negligible. On the strength of the above authorities, I am inclined to take the view that the expression 'individuals' in Section 3 of the Act includes non-Hindu families such as a Mappila Marumakka-thayam Tarwad.`,

21:`\t1.The learned District Munsif of Cannanore has referred the following question for decision by this Court: Whether the Madras Shariat (Amendment) Act (Act XVIII of 26/05/1949) is ultra vires of Article 19. Clause (1)(f) of the Constitution Act. The question was raised in a suit pending before the learned District Munsif brought by the widow of one deceased Abdulla Kalpha for partition and separate possession of certain properties, described in schedule A to the plaint. Abdulla Kalpha was a member of a Marumakkathayam tarwad. On 30th October, 1918, the members of the tarwad executed a karar in and by which the main tarwad was divided into three tavazhis. Abdulla Kalpha was a member of the third tavazhi and was one of the executants of the document.

\tThe said karar provided inter alia that in case one tavazhi became extinct, the properties allotted to the said tavazhi would lapse to the other tavazhis. Abdulla Kalpha was the sole surviving member of the third tavazhi. He died on 10th January, 1952. The main question in the case is whether on his death, the properties of the third tavazhi, which Abdulla Kalpha died possessed of, lapsed to the second tavazhi, the first tavazhi having become extinct, as per the terms of the karar, or whether the widow and other heirs of Abdulla Kalpha, according to the Muslim Shariat, i.e., personal law, became entitled to the said properties. The plaintiff claimed that she and the other personal heirs, defendants 1 to 8, became entitled to the properties, because of the provisions of the Madras Shariat (Amendment) Act of 26.05.1949.

\tDefendants 9 and 10, who are the karnavan and the senior most anandiravan of the second tavazhi, contended that the said Act was void because it was repugnant to the provisions of Article 19, Clause (1)(f) of the Constitution.3. Madras Act XVIII of 1949, the impugned Act, amended the Muslim Personal Law (Shariat) Application Act (XXVI of 23.01.1937) passed by the Central Legislature. The only material section of the Act for the purpose of this reference is Section 2. That section originally stood as follows:

\tNotwithstanding any custom or usage to the contrary, in all questions (save questions relating to agricultural land) regarding intestate succession special property of females, including personal properly inherited or obtained under contract or gift or any other provision of personal law, marriage, dissolution of marriage, including talak, ila, zihar, lian, khula and mubarat, maintenance, dower, guardianship, gifts, trusts and trust properties, and wakfs (other than charities and charitable institutions and charitable and religious endowments), the rule of decision in cases where the parties are Muslims shall be the Muslim personal Law (Shariat). In the above view, no question of the constitutional validity of Madras Act XVIII of 26/05/1949 can arise. Our answer to the reference is that the said Act is not repugnant to Article 19(1)(f) of the Constitution.`,

22:`\tThis regular first appeal has been heard afresh pursuant to the directions issued by the Hon'ble Supreme Court in Civil Appeal No.67/2016, dated 04/01/2016. This appeal is filed by the defendants, in O.S.No.456/1988, being aggrieved by the judgment and decree passed by the III Additional Civil Judge, Bijapur, dated 29/06/1996. That suit was filed by the respondents/plaintiffs seeking the relief of partition, separate possession and declaration. For the sake of convenience, the parties herein shall be referred to, in terms of their status before the trial Court. The respondents/plaintiffs filed the suit in respect of two landed properties bearing RS.Nos.116 and 246, measuring 28 acres 30 guntas and 28 acres 11 guntas, respectively situated at Bidarkundi Village and suit houses bearing MPC Nos.75 and 76, (hereinafter referred to as "the suit schedule properties"). 

\tAccording to the plaintiffs, one Imamsa was the original propositus, he had two sons namely, Chandsa and Lalsa. Lalsa, the second son of the original propositus-Imamsa, died long ago without having any legal heirs. Chandsa had two wives namely, Anasarama and Rajama. Through Ansarama, Chandsa, begot a son, Nabisa, who is the husband of defendant No.1 and father of defendant Nos.2 to 5. Through his second wife, Rajama, Chandsa had six children namely, two sons who are plaintiff Nos.1 and 2 and four daughters i.e., plaintiff Nos.3 to 5 and one Sahebi, the deceased mother of plaintiff Nos.6 and 7. Chandsa being the elder son of Imamsa, died leaving behind eight legal heirs namely, widow Rajama, three sons and four daughters. Ansarama, his first wife, predeceased Chandsa. Nabisa died on 17/01/1976, leaving behind his legal heirs namely, his widow and sons, defendants in the suit. His widow, Chandama died on 19/09/1988.

\tAccording to the plaintiffs, the suit lands were formerly walikaraki lands. The family of plaintiffs and defendants was a walikaraki family. In the erstwhile Bombay State, walikaraki lands were continued only with the officiating walikar who usually happened to be the eldest member and they were not partible. Later Bombay High Court held that the suit lands were watan lands and as such they were heritable and partible. Even then the Government of the erstwhile Bombay State did not permit walikaraki lands to be partitioned by metes and bounds and it continued only with the officiating walikar.

\tThis state of affairs continued till the reorganization of states and formation of new Mysore State, on 01/11/1956, by which, four districts of north Karnataka i.e., Bijapur, Belgaum, Dharwad and Karwar, were added to Mysore State. After reorganization of State of Mysore, it was renamed Karnataka State on 01/11/1973. In support of their case, second plaintiff examined himself as PW.1. Another witness was examined as PW.2. Plaintiffs produced twenty documents, which were marked as Exs.P-1 to P-20. Defendant No.3 was examined as DW.1. They produced fifteen documents, which were marked as Exs.D-1 to D-15.`,

23:`\tSection 23 of the Urban Land (Ceiling and Regulation) Act is valid and does not suffer from any constitutional infirmity. Sub-section (4) of section 23 is the prepondering provisio governing the disposal of excess vacant land acquired under the Act. Though it is "subject to the provisions of sub-section (1) (2), and (3)", the provisions of sub-section (1) are enabling and not compulsive and those of sub-sections (2) and (3) are incidental to the provisions of sub-section (1).

\tThe disposal of excess vacant lands must therefore be made strictly in accordance with the mandate of sub-section (4) of section 23, subject to this, that in a given case such land may be allotted to any person, for any purpose relating to, original connection with any "industry" or the other purposes mentioned in sub-section (1), provided that by such allotment, a common good will be subserved. The governing test of disposal of excess land being "social good", any disposal in any particular case or cases which does not subserve that purpose will be liable, to be struck down as being contrary to the scheme and intendment of the Act. "Common Good", being the writing on the wall, any disposal which does not serve that purpose will be outside the scope of the Act and, therefore, lacking in competence in diverse senses.
